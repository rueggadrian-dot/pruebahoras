<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tecnosuisse · Control de Producción</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js"></script>
<style>
  :root{
    --ink:#1B2430;--steel:#2B4C5C;--steel-light:#3E6B7F;--glass:#C7DDE3;
    --concrete:#EDEEF0;--paper:#F7F8F8;--amber:#E8873A;--amber-soft:#FCE6D2;
    --red:#C4483A;--red-soft:#F6DAD6;--green:#4C7A5E;--green-soft:#DCEBE0;
    --line:#D8DBDD;--radius:4px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--concrete);color:var(--ink);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  .app{max-width:960px;margin:0 auto;min-height:100vh;background:var(--paper);}
  header.top{background:var(--ink);color:var(--paper);padding:20px 18px 16px;position:sticky;top:0;z-index:10;}
  header.top .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--glass);opacity:.85;}
  header.top h1{font-family:'Oswald',sans-serif;font-weight:600;font-size:24px;letter-spacing:.02em;margin:2px 0 12px;text-transform:uppercase;}
  nav.tabs{display:flex;gap:2px;background:rgba(255,255,255,.08);border-radius:var(--radius);padding:3px;}
  nav.tabs button{flex:1;border:none;background:transparent;color:var(--glass);font-family:'Oswald',sans-serif;font-size:12px;letter-spacing:.03em;text-transform:uppercase;padding:9px 3px;border-radius:3px;cursor:pointer;}
  nav.tabs button.active{background:var(--paper);color:var(--ink);font-weight:600;}
  main{padding:16px 18px 60px;}
  .section-title{font-family:'Oswald',sans-serif;font-weight:600;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--steel);margin:24px 0 10px;display:flex;align-items:center;gap:8px;}
  .section-title:first-child{margin-top:2px;}
  .section-title::after{content:"";flex:1;height:1px;background:var(--line);}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:12px;}
  label{display:block;font-size:12px;font-weight:600;color:var(--steel);margin:12px 0 5px;letter-spacing:.02em;}
  label:first-child{margin-top:0;}
  select,input{width:100%;padding:11px 10px;border:1px solid var(--line);border-radius:3px;font-family:'Inter',sans-serif;font-size:15px;background:var(--concrete);color:var(--ink);}
  textarea{width:100%;padding:11px 10px;border:1px solid var(--line);border-radius:3px;font-family:'Inter',sans-serif;font-size:15px;background:var(--concrete);color:var(--ink);min-height:70px;resize:vertical;}
  textarea:focus{outline:2px solid var(--steel-light);outline-offset:0;}
  input[type=checkbox]{width:auto;accent-color:var(--steel);}
  select:focus,input:focus{outline:2px solid var(--steel-light);outline-offset:0;}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
  .btn{font-family:'Oswald',sans-serif;font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;border:none;border-radius:3px;padding:13px 18px;cursor:pointer;background:var(--steel);color:var(--paper);width:100%;margin-top:16px;}
  .btn:hover{background:var(--steel-light);}
  .btn:disabled{background:#C3CACD;color:#8B9296;cursor:not-allowed;}
  .btn.small{width:auto;padding:8px 12px;font-size:11px;margin-top:0;}
  .btn.ghost{background:transparent;color:var(--steel);border:1px solid var(--steel);}
  .check-row{display:flex;align-items:center;gap:8px;font-weight:400;text-transform:none;letter-spacing:0;font-size:14px;padding:7px 0;border-bottom:1px solid var(--line);color:var(--ink);}
  .check-row:last-child{border-bottom:none;}
  .badge{font-family:'IBM Plex Mono',monospace;font-size:11px;font-weight:600;padding:3px 8px;border-radius:12px;letter-spacing:.02em;display:inline-block;}
  .b-vidrio{background:var(--glass);color:var(--steel);}
  .b-carpinteria{background:#E7DFD0;color:#7A5A2E;}
  .b-instalacion{background:#DDE3D6;color:#4C6236;}
  .empty{text-align:center;padding:36px 12px;color:#8A9399;font-size:14px;}
  .empty strong{display:block;color:var(--ink);font-family:'Oswald',sans-serif;text-transform:uppercase;font-size:13px;margin-bottom:4px;letter-spacing:.05em;}
  .list-item{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px;gap:10px;}
  .list-item:last-child{border-bottom:none;}
  .list-item .meta{color:#8A9399;font-size:12px;font-family:'IBM Plex Mono',monospace;}
  .del{background:none;border:none;color:#B4585A;cursor:pointer;font-size:12px;font-family:'IBM Plex Mono',monospace;padding:4px 8px;}
  .gauge-wrap{margin:10px 0 4px;}
  .gauge-head{display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:12px;margin-bottom:6px;}
  .gauge-head .pct{font-weight:700;font-size:14px;}
  .gauge{height:14px;background:var(--concrete);border-radius:7px;overflow:hidden;border:1px solid var(--line);}
  .gauge-fill{height:100%;border-radius:7px 0 0 7px;transition:width .3s;}
  .gauge-ticks{display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:9px;color:#A6ADB2;margin-top:3px;}
  .status-ok .gauge-fill{background:var(--green);}
  .status-warn .gauge-fill{background:var(--amber);}
  .status-crit .gauge-fill{background:var(--red);}
  .alert-banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:3px;font-size:13px;margin-bottom:8px;border-left:3px solid;}
  .alert-warn{background:var(--amber-soft);border-color:var(--amber);color:#7A4A18;}
  .alert-crit{background:var(--red-soft);border-color:var(--red);color:#7A2620;}
  .alert-banner .tag{font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:11px;text-transform:uppercase;}
  .obra-select{background:var(--steel);color:var(--paper);border-radius:3px;padding:14px;margin-bottom:14px;}
  .obra-select select{background:var(--ink);color:var(--paper);border-color:var(--steel-light);}
  .kpi-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
  .kpi{background:var(--ink);color:var(--paper);border-radius:3px;padding:14px;}
  .kpi .val{font-family:'IBM Plex Mono',monospace;font-size:20px;font-weight:600;}
  .kpi .lbl{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--glass);margin-top:3px;}
  .subtabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
  .subtabs button{border:1px solid var(--line);background:var(--paper);color:var(--steel);font-family:'IBM Plex Mono',monospace;font-size:11px;padding:6px 12px;border-radius:14px;cursor:pointer;}
  .subtabs button.active{background:var(--steel);color:var(--paper);border-color:var(--steel);}
  .calc-box{background:var(--concrete);border-radius:3px;padding:10px 12px;margin-top:12px;font-family:'IBM Plex Mono',monospace;font-size:12px;display:flex;justify-content:space-between;}
  .footnote{font-size:11px;color:#8A9399;text-align:center;margin-top:30px;line-height:1.6;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:11px 20px;border-radius:20px;font-size:13px;box-shadow:0 4px 16px rgba(0,0,0,.25);opacity:0;transition:opacity .25s;pointer-events:none;z-index:100;max-width:86%;text-align:center;}
  .toast.show{opacity:1;}
  .step-done{background:var(--green-soft);border:1px solid var(--green);color:#2F5A40;padding:12px 14px;border-radius:3px;font-family:'IBM Plex Mono',monospace;font-size:13px;display:flex;justify-content:space-between;margin-bottom:10px;}
  .step-pending{background:var(--concrete);border:1px dashed var(--line);color:#8A9399;padding:12px 14px;border-radius:3px;font-family:'IBM Plex Mono',monospace;font-size:12px;margin-bottom:10px;text-align:center;}
  .trip-summary{background:var(--concrete);border-radius:3px;padding:12px 14px;margin-bottom:10px;font-size:13px;}
  .trip-summary .t-row{display:flex;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:12px;padding:3px 0;}
  .area-mini{display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px;}
  .area-mini:last-child{border-bottom:none;}
  .totales-box{background:var(--ink);color:var(--paper);border-radius:3px;padding:12px 14px;margin-bottom:12px;font-family:'IBM Plex Mono',monospace;font-size:13px;display:flex;justify-content:space-between;}
  .chip{display:inline-block;background:var(--glass);color:var(--steel);font-family:'IBM Plex Mono',monospace;font-size:11px;padding:4px 9px;border-radius:12px;margin:3px 4px 0 0;}
  .chip.out{background:#F0D8D6;color:#8A3B33;}
  .report-card{border-radius:var(--radius);padding:14px;margin-bottom:10px;border:1px solid var(--line);border-left:4px solid var(--line);}
  .report-card.rc-ok{border-left-color:var(--green);}
  .report-card.rc-warn{border-left-color:var(--amber);background:#FFFBF6;}
  .report-card.rc-crit{border-left-color:var(--red);background:#FFF9F8;}
  .report-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;}
  .report-head .name{font-family:'Oswald',sans-serif;font-weight:600;font-size:14px;text-transform:uppercase;letter-spacing:.02em;}
  .report-head .horas{font-family:'IBM Plex Mono',monospace;font-size:13px;font-weight:600;}
  .flag-line{font-size:12px;margin:3px 0;padding:3px 0;}
  .flag-line.f-crit{color:#A5342B;}
  .flag-line.f-warn{color:#9A5A17;}
  .detail-item{background:var(--concrete);border-radius:3px;padding:10px 12px;margin-top:8px;font-size:13px;}
  .detail-item .drow{display:flex;justify-content:space-between;align-items:center;font-family:'IBM Plex Mono',monospace;font-size:12px;margin-top:4px;}
  .actions{display:flex;gap:6px;margin-top:8px;}
  .journey-track{display:flex;justify-content:space-between;margin:10px 0 4px;position:relative;}
  .journey-track .jstep{flex:1;text-align:center;font-family:'IBM Plex Mono',monospace;font-size:9px;color:#A6ADB2;text-transform:uppercase;letter-spacing:.03em;}
  .journey-track .jstep.done{color:var(--green);font-weight:600;}
  .stackbar-wrap{margin:8px 0 4px;}
  .stackbar{position:relative;height:16px;background:var(--concrete);border:1px solid var(--line);border-radius:3px;overflow:visible;}
  .stack-seg{position:absolute;top:0;height:100%;}
  .stack-tick{position:absolute;top:-3px;bottom:-3px;left:100%;width:2px;background:var(--ink);}
  .stackbar-legend{display:flex;flex-wrap:wrap;margin-top:6px;}
  table.cierre-table{width:100%;border-collapse:collapse;font-size:12px;font-family:'IBM Plex Mono',monospace;}
  table.cierre-table th, table.cierre-table td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;}
  table.cierre-table th{font-family:'Oswald',sans-serif;text-transform:uppercase;font-size:10px;letter-spacing:.05em;color:var(--steel);}
  .b-mant{background:#E6DDEE;color:#6A4A80;}
  nav.tabs{overflow-x:auto;scrollbar-width:none;}
  nav.tabs::-webkit-scrollbar{display:none;}
  nav.tabs button{flex:1 0 auto;padding:9px 8px;white-space:nowrap;}
  .garantia-box{display:flex;gap:12px;align-items:center;margin-top:16px;padding:14px;border:2px dashed var(--amber);background:var(--amber-soft);border-radius:4px;color:#7A4A18;font-size:14px;text-transform:none;letter-spacing:0;cursor:pointer;}
  .garantia-box input{transform:scale(1.6);accent-color:var(--amber);}
  .garantia-box.on{border-style:solid;background:#F9D2AE;}
  .garantia-box small{font-weight:400;}
  .print-only{display:none;}
  .proforma{font-family:'Inter',Arial,sans-serif;color:#222;}
  @page{ size:A4; margin:0; }
  @media print{
    .print-only{display:block !important;}
    html,body{ margin:0 !important; }
    html,body,.app,main{ background:#fff !important; }
    main{ padding:14mm 15mm !important; }
    .pf-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid #EF3135;padding-bottom:10px;margin-bottom:14px;}
    .pf-head img{width:62mm;height:auto;}
    .pf-doc{text-align:right;}
    .pf-doc .t{font-family:'Oswald',sans-serif;font-size:20px;letter-spacing:.05em;color:#222;}
    .pf-doc .n{font-size:15px;font-weight:700;color:#EF3135;margin-top:2px;}
    .pf-doc .f{font-size:12px;color:#555;margin-top:2px;}
    .pf-datos{display:grid;grid-template-columns:28mm 1fr;gap:3px 10px;font-size:12.5px;margin-bottom:12px;}
    .pf-datos b{color:#555;font-weight:600;}
    .pf-sec{font-family:'Oswald',sans-serif;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:#555;margin:14px 0 4px;}
    .pf-tabla{width:100%;border-collapse:collapse;font-size:12.5px;}
    .pf-tabla th{background:#f1f1f1;text-align:left;padding:6px 8px;font-weight:600;border-bottom:1px solid #bbb;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    .pf-tabla td{padding:6px 8px;border-bottom:1px solid #e3e3e3;vertical-align:top;}
    .pf-tabla .r{text-align:right;white-space:nowrap;}
    .pf-tabla tr{break-inside:avoid;}
    .pf-tot{margin-top:10px;margin-left:auto;width:85mm;font-size:13px;}
    .pf-tot div{display:flex;justify-content:space-between;padding:4px 8px;}
    .pf-tot .g{color:#555;}
    .pf-tot .fin{background:#222;color:#fff;font-weight:700;font-size:15px;padding:8px;margin-top:4px;-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    .pf-nota{font-size:11px;color:#666;margin-top:16px;}
    .pf-detalle{font-size:12.5px;white-space:pre-wrap;}
    .print-head{font-family:'Oswald',sans-serif;font-size:18px;letter-spacing:.04em;margin-bottom:8px;}
    .totales-box{-webkit-print-color-adjust:exact;print-color-adjust:exact;}
    header.top, nav.tabs, .footnote, .no-print{ display:none !important; }
    body{ background:#fff; }
    .app{ max-width:100%; }
    main{ padding:0; }
    .card{ border:1px solid #ccc; box-shadow:none; break-inside:avoid; }
    .section-title{ break-after:avoid; }
  }
.mant-grupo{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:#6b7280;margin:12px 0 4px;padding-bottom:3px;border-bottom:1px solid #e5e7eb;}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="eyebrow">Tecnosuisse · Vidrio / Carpintería / Instalación / Mantenimiento</div>
    <h1>Control de Producción</h1>
    <nav class="tabs">
      <button data-tab="captura" class="active">Captura</button>
      <button data-tab="mantenimientos">Mantenimientos</button>
      <button data-tab="reportes">Reportes</button>
      <button data-tab="cierre">Cierre</button>
      <button data-tab="cierremant">Cierre Mant.</button>
      <button data-tab="config">Config</button>
    </nav>
  </header>
  <main id="main"></main>
</div>
<div class="toast" id="toast"></div>

<script>
const AREAS=[{id:'vidrio',nombre:'Vidrio',badge:'b-vidrio'},{id:'carpinteria',nombre:'Carpintería',badge:'b-carpinteria'},{id:'instalacion',nombre:'Instalación',badge:'b-instalacion'}];
const AREA_MANT={id:'mantenimiento',nombre:'Mantenimiento',badge:'b-mant'};
const ROLES={vidrio:['Jefe de Vidrio','Ayudante de Vidrio'],carpinteria:['Jefe de Carpintería','Ayudante de Carpintería'],instalacion:['Maestro de Obra','Ayudante de Instalación'],mantenimiento:['Encargado de Mantenimiento','Ayudante de Mantenimiento']};
const JEFE_ROLES=['Jefe de Vidrio','Jefe de Carpintería','Maestro de Obra'];
const ALMUERZO=0.5;
const PALETA=['#2B4C5C','#E8873A','#4C7A5E','#8A5FA0','#C4483A','#3E6B7F','#B08D3E','#5C7A8A','#7A5A2E','#4C6236'];
const ADMIN_PASS='admintecno';
const SUPABASE_URL='https://dlycauyzobzxsgirsskp.supabase.co';
const SUPABASE_KEY='sb_publishable_TYalmYmXM9og3gfKuCpoDw_vE9q8GO3';
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);

let DB={obras:[],personas:[],presupuestos:[],registros:[],instalaciones:[],mant:[],mantItems:[],notionObras:[],ajustes:{costoHora:0,jornadaEstandar:9.5,horaEntradaTaller:'07:00',precioHoraMantBs:0,factorMant:1.508}};
let currentTab='captura';
let capPersonaId='', capObraId='', capFecha='';
let configSub='obras';
let presupuestoObraId=null;
let reportesFecha=null;
let reportEditKey=null;
let agregandoInstalacionManual=false;
let manualArea='vidrio';
let authenticated=false;

function uid(){ return crypto.randomUUID().slice(0,8); }
function todayStr(){ return new Date().toLocaleDateString('en-CA'); }
function yesterdayStr(){ return new Date(Date.now()-86400000).toLocaleDateString('en-CA'); }
function nowTime(){ return new Date().toTimeString().slice(0,5); }
function toast(msg){ const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2800); }
function esJefeRol(rol){ return JEFE_ROLES.includes(rol); }
function t5(x){ return x? String(x).slice(0,5) : x; }
function sbErr(error){ if(error){ console.error(error); toast('Error de conexión: '+error.message); return true; } return false; }

async function loadAll(){
  const [obrasR,personasR,presupuestosR,registrosR,regAyudR,instalacionesR,instAyudR,instCambiosR,ajustesR]=await Promise.all([
    sb.from('obras').select('*'),
    sb.from('personas').select('*'),
    sb.from('presupuestos').select('*'),
    sb.from('registros').select('*'),
    sb.from('registros_ayudantes').select('*'),
    sb.from('instalaciones').select('*'),
    sb.from('instalaciones_ayudantes').select('*'),
    sb.from('instalaciones_cambios').select('*'),
    sb.from('ajustes').select('*').limit(1)
  ]);
  for(const r of [obrasR,personasR,presupuestosR,registrosR,regAyudR,instalacionesR,instAyudR,instCambiosR,ajustesR]){ if(sbErr(r.error)) return; }

  DB.obras=(obrasR.data||[]).map(o=>({id:o.id,nombre:o.nombre,cliente:o.cliente,fechaInicio:o.fecha_inicio,terminada:!!o.terminada}));
  DB.personas=(personasR.data||[]).map(p=>({id:p.id,nombre:p.nombre,areaId:p.area_id,rol:p.rol,activo:p.activo}));
  DB.presupuestos=(presupuestosR.data||[]).map(p=>({id:p.id,obraId:p.obra_id,concepto:p.concepto,horas:Number(p.horas),monto:Number(p.monto),carpinterias:Number(p.carpinterias),fecha:p.fecha}));

  const ayudPorRegistro={};
  (regAyudR.data||[]).forEach(ra=>{ (ayudPorRegistro[ra.registro_id]=ayudPorRegistro[ra.registro_id]||[]).push(ra.persona_id); });
  DB.registros=(registrosR.data||[]).map(r=>({
    id:r.id,personaId:r.persona_id,obraId:r.obra_id,areaId:r.area_id,fecha:r.fecha,
    horas:Number(r.horas),incluyeJefe:r.incluye_jefe,piezas:Number(r.piezas),notas:r.notas,
    ayudantesIds:ayudPorRegistro[r.id]||[]
  }));

  const ayudPorInstalacion={};
  (instAyudR.data||[]).forEach(ia=>{ (ayudPorInstalacion[ia.instalacion_id]=ayudPorInstalacion[ia.instalacion_id]||[]).push(ia.persona_id); });
  const cambiosPorInstalacion={};
  (instCambiosR.data||[]).forEach(c=>{ (cambiosPorInstalacion[c.instalacion_id]=cambiosPorInstalacion[c.instalacion_id]||[]).push({id:c.id,hora:t5(c.hora),tipo:c.tipo,personaId:c.persona_id}); });
  DB.instalaciones=(instalacionesR.data||[]).map(r=>({
    id:r.id,personaId:r.persona_id,obraId:r.obra_id,fecha:r.fecha,incluyeJefe:r.incluye_jefe,
    salida:t5(r.salida),llegada:t5(r.llegada),salidaObra:t5(r.salida_obra),llegadaTaller:t5(r.llegada_taller),
    carpinteriasInstaladas:Number(r.carpinterias_instaladas||0),carpinteriasMosquitero:Number(r.carpinterias_mosquitero||0),
    detalle:r.detalle||'',
    vaAOtraObra:!!r.va_a_otra_obra, vieneDe:r.viene_de_instalacion||null,
    ayudantesIds:ayudPorInstalacion[r.id]||[],
    cambios:(cambiosPorInstalacion[r.id]||[]).sort((a,b)=>a.hora.localeCompare(b.hora))
  }));

  const aj=(ajustesR.data||[])[0];
  DB.ajustes=aj? {costoHora:Number(aj.costo_hora),jornadaEstandar:Number(aj.jornada_estandar),horaEntradaTaller:t5(aj.hora_entrada_taller),precioHoraMantBs:Number(aj.precio_hora_mant_bs||0),factorMant:Number(aj.factor_mant||1.508),tipoCambio:aj.tipo_cambio==null?null:Number(aj.tipo_cambio),tipoCambioFecha:aj.tipo_cambio_fecha,tipoCambioAct:aj.tipo_cambio_actualizado,precioMallaBsM2:Number(aj.precio_malla_bs_m2||90)} : {costoHora:0,jornadaEstandar:9.5,horaEntradaTaller:'07:00',precioHoraMantBs:0,factorMant:1.508};
  await Promise.all([recargarMant(),recargarCatalogos()]);
}

// ---------- CÁLCULOS ----------
function calcHoras(h1,h2){
  if(!h1||!h2) return 0;
  const [a1,m1]=h1.split(':').map(Number),[a2,m2]=h2.split(':').map(Number);
  let diff=(a2*60+m2)-(a1*60+m1); if(diff<0) diff+=24*60; return diff/60;
}
function contarPersonas(r){ return (r.ayudantesIds||[]).length + (r.incluyeJefe?1:0); }
function horasArea(obraId,areaId){
  return DB.registros.filter(r=>r.obraId===obraId&&r.areaId===areaId).reduce((s,r)=>s+Number(r.horas||0)*contarPersonas(r),0);
}
function piezasArea(obraId,areaId){
  return DB.registros.filter(r=>r.obraId===obraId&&r.areaId===areaId).reduce((s,r)=>s+Number(r.piezas||0),0);
}
// Equipo (Set) presente en cada instante durante [llegada, salidaObra]
function segmentosTrabajo(r){
  if(!r.llegada) return [];
  const fin=r.salidaObra||null;
  let team=new Set(r.ayudantesIds||[]); if(r.incluyeJefe) team.add(r.personaId);
  const cambios=(r.cambios||[]).slice().sort((a,b)=>a.hora.localeCompare(b.hora));
  let segments=[],prevHora=r.llegada;
  cambios.forEach(c=>{
    if(fin && c.hora>=fin) return;
    if(c.hora<=prevHora) return;
    segments.push({inicio:prevHora,fin:c.hora,size:team.size});
    if(c.tipo==='incorporacion') team.add(c.personaId); else team.delete(c.personaId);
    prevHora=c.hora;
  });
  if(fin) segments.push({inicio:prevHora,fin,size:team.size});
  return segments;
}
function trabajoBrutoHH(r){
  return segmentosTrabajo(r).reduce((s,seg)=>s+calcHoras(seg.inicio,seg.fin)*seg.size,0);
}
function miembrosActuales(r){
  let set=new Set(r.ayudantesIds||[]); if(r.incluyeJefe) set.add(r.personaId);
  (r.cambios||[]).slice().sort((a,b)=>a.hora.localeCompare(b.hora)).forEach(c=>{ if(c.tipo==='incorporacion') set.add(c.personaId); else set.delete(c.personaId); });
  return set;
}
function horasInstalacionDetalle(obraId){
  const regs=DB.instalaciones.filter(r=>r.obraId===obraId);
  let ida=0,vuelta=0,trabajo=0,preparacion=0;
  regs.forEach(r=>{
    ida += calcHoras(r.salida,r.llegada)*contarPersonas(r);
    const segs=segmentosTrabajo(r);
    const sizeAlFinal = segs.length? segs[segs.length-1].size : contarPersonas(r);
    vuelta += calcHoras(r.salidaObra,r.llegadaTaller)*sizeAlFinal;
    trabajo += trabajoBrutoHH(r);
    preparacion += tiempoPreparacion(r)*contarPersonas(r);
  });
  trabajo = Math.max(trabajo - almuerzosAsignadosObra(obraId), 0);
  return {ida,vuelta,trabajo,preparacion};
}
// --- Almuerzo: una vez por persona por día, asignado a la obra donde más trabajó ---
function trabajoPersonaObraFecha(personaId,fecha){
  const map={};
  DB.instalaciones.filter(r=>r.fecha===fecha).forEach(r=>{
    const w=personaSegmentoInstalacion(r,personaId).workHours;
    if(w>0) map[r.obraId]=(map[r.obraId]||0)+w;
  });
  return map;
}
function almuerzoObraAsignada(personaId,fecha){
  const map=trabajoPersonaObraFecha(personaId,fecha);
  let best=null,bw=0;
  Object.keys(map).forEach(o=>{ if(map[o]>bw){bw=map[o];best=o;} });
  return best;
}
function personasConTrabajoFecha(fecha){
  const set=new Set();
  DB.instalaciones.filter(r=>r.fecha===fecha).forEach(r=>{
    (r.ayudantesIds||[]).forEach(id=>set.add(id));
    if(r.incluyeJefe) set.add(r.personaId);
    (r.cambios||[]).forEach(c=>set.add(c.personaId));
  });
  return set;
}
function almuerzosAsignadosObra(obraId){
  const fechas=[...new Set(DB.instalaciones.filter(r=>r.obraId===obraId).map(r=>r.fecha))];
  let total=0;
  fechas.forEach(f=>{
    personasConTrabajoFecha(f).forEach(pid=>{
      if(almuerzoObraAsignada(pid,f)===obraId) total+=ALMUERZO;
    });
  });
  return total;
}
// Solo el primer viaje del día de cada maestro carga tiempo de preparación (entrada al taller → salida)
function esPrimerViajeDelDia(r){
  if(!r.salida) return false;
  const delDia=DB.instalaciones.filter(x=>x.personaId===r.personaId && x.fecha===r.fecha && x.salida);
  if(delDia.length===0) return false;
  const primero=delDia.reduce((a,b)=> a.salida<=b.salida? a:b);
  return primero.id===r.id;
}
function tiempoPreparacion(r){
  const horaEntrada=DB.ajustes.horaEntradaTaller;
  if(!horaEntrada || !r.salida) return 0;
  if(!esPrimerViajeDelDia(r)) return 0;
  // Si salen antes (o a la misma hora) de la entrada al taller, no hubo preparación.
  // No usar calcHoras aquí: suma 24h cuando la segunda hora es menor (cruce de medianoche).
  const [eh,em]=String(horaEntrada).split(':').map(Number), [sh,sm]=String(r.salida).split(':').map(Number);
  const mins=(sh*60+sm)-(eh*60+em);
  return mins>0 ? mins/60 : 0;
}
function horasHombreTotalesObra(obraId){
  const ins=horasInstalacionDetalle(obraId);
  return horasArea(obraId,'vidrio')+horasArea(obraId,'carpinteria')+ins.ida+ins.vuelta+ins.trabajo+ins.preparacion;
}
function presupuestoTotales(obraId){
  return DB.presupuestos.filter(p=>p.obraId===obraId).reduce((acc,p)=>({horas:acc.horas+Number(p.horas||0),monto:acc.monto+Number(p.monto||0),carpinterias:acc.carpinterias+Number(p.carpinterias||0)}),{horas:0,monto:0,carpinterias:0});
}
function carpinteriasObra(obraId){
  const regs=DB.instalaciones.filter(r=>r.obraId===obraId);
  const instaladas=regs.reduce((s,r)=>s+Number(r.carpinteriasInstaladas||0),0);
  const mosquitero=regs.reduce((s,r)=>s+Number(r.carpinteriasMosquitero||0),0);
  return {instaladas,mosquitero};
}
function costoTotalObra(obraId){ return horasHombreTotalesObra(obraId)*Number(DB.ajustes.costoHora||0); }
function costoHoy(){
  const hoy=todayStr(), rate=Number(DB.ajustes.costoHora||0); let hh=0;
  DB.registros.filter(r=>r.fecha===hoy).forEach(r=>{ hh+=Number(r.horas||0)*contarPersonas(r); });
  DB.instalaciones.filter(r=>r.fecha===hoy).forEach(r=>{
    const segs=segmentosTrabajo(r); const sizeFin=segs.length?segs[segs.length-1].size:contarPersonas(r);
    hh += calcHoras(r.salida,r.llegada)*contarPersonas(r) + calcHoras(r.salidaObra,r.llegadaTaller)*sizeFin + trabajoBrutoHH(r) + tiempoPreparacion(r)*contarPersonas(r);
  });
  personasConTrabajoFecha(hoy).forEach(pid=>{ if(almuerzoObraAsignada(pid,hoy)) hh-=ALMUERZO; });
  return Math.max(hh,0)*rate;
}
function statusFor(pct){ if(pct>=100) return 'crit'; if(pct>=80) return 'warn'; return 'ok'; }

// Horas personales (de UNA persona) trabajadas en un registro de instalación
function personaSegmentoInstalacion(r,personaId){
  const initial=new Set(r.ayudantesIds||[]); if(r.incluyeJefe) initial.add(r.personaId);
  const presentAtStart=initial.has(personaId);
  if(!r.llegada||!r.salidaObra) return {presentAtStart,presentAtEnd:presentAtStart,workHours:0};
  let present=presentAtStart, start=presentAtStart?r.llegada:null, total=0;
  const cambios=(r.cambios||[]).filter(c=>c.personaId===personaId && c.hora>r.llegada && c.hora<r.salidaObra).sort((a,b)=>a.hora.localeCompare(b.hora));
  cambios.forEach(c=>{
    if(c.tipo==='incorporacion'&&!present){present=true;start=c.hora;}
    else if(c.tipo==='salida'&&present){ total+=calcHoras(start,c.hora); present=false; start=null; }
  });
  if(present) total+=calcHoras(start,r.salidaObra);
  return {presentAtStart,presentAtEnd:present,workHours:total};
}
function horasPersonalesInstalacionBruta(r,personaId){
  const seg=personaSegmentoInstalacion(r,personaId);
  let total=0;
  if(seg.presentAtStart){ total+=calcHoras(r.salida,r.llegada); total+=tiempoPreparacion(r); }
  total+=seg.workHours;
  if(seg.presentAtEnd) total+=calcHoras(r.salidaObra,r.llegadaTaller);
  return total;
}
function personaHorasHoyExistente(personaId,fecha){
  let total=0;
  DB.registros.filter(r=>r.fecha===fecha).forEach(r=>{
    if((r.incluyeJefe&&r.personaId===personaId)||(r.ayudantesIds||[]).includes(personaId)) total+=Number(r.horas||0);
  });
  DB.instalaciones.filter(r=>r.fecha===fecha).forEach(r=>{ total+=horasPersonalesInstalacionBruta(r,personaId); });
  if(almuerzoObraAsignada(personaId,fecha)) total-=ALMUERZO;
  DB.mant.filter(m=>m.fecha===fecha).forEach(m=>{ total+=horasMantPersona(m,personaId); });
  return Math.max(total,0);
}
function desglosePersonaFecha(personaId,fecha){
  const map={};
  DB.registros.filter(r=>r.fecha===fecha && ((r.incluyeJefe&&r.personaId===personaId)||(r.ayudantesIds||[]).includes(personaId))).forEach(r=>{
    map[r.obraId]=(map[r.obraId]||0)+Number(r.horas||0);
  });
  DB.instalaciones.filter(r=>r.fecha===fecha).forEach(r=>{
    const h=horasPersonalesInstalacionBruta(r,personaId);
    if(h>0) map[r.obraId]=(map[r.obraId]||0)+h;
  });
  const lunchObra=almuerzoObraAsignada(personaId,fecha);
  if(lunchObra && map[lunchObra]!==undefined) map[lunchObra]=Math.max(map[lunchObra]-ALMUERZO,0);
  DB.mant.filter(m=>m.fecha===fecha).forEach(m=>{ const h=horasMantPersona(m,personaId); if(h>0) map.MANT=(map.MANT||0)+h; });
  return map;
}

async function guardarRegistro(personaId,obraId){
  const persona=DB.personas.find(p=>p.id===personaId);
  const ayudantesIds=Array.from(document.querySelectorAll('.ayu-check:checked')).map(el=>el.value);
  const incluyeJefe=document.getElementById('reg-incluye-jefe').checked;
  const horas=document.getElementById('reg-horas').value, piezas=document.getElementById('reg-piezas').value, notas=document.getElementById('reg-notas').value;
  if((ayudantesIds.length+((incluyeJefe)?1:0))===0){ toast('Seleccioná al menos una persona (ayudante o vos mismo)'); return; }
  if(!horas){ toast('Ingresá las horas trabajadas'); return; }
  const fecha=document.getElementById('cap-fecha')?document.getElementById('cap-fecha').value:todayStr();
  const {data,error}=await sb.from('registros').insert({
    persona_id:personaId, obra_id:obraId, area_id:persona.areaId, fecha, horas:Number(horas), incluye_jefe:incluyeJefe, piezas:Number(piezas||0), notas
  }).select().single();
  if(sbErr(error)) return;
  if(ayudantesIds.length){
    const {error:e2}=await sb.from('registros_ayudantes').insert(ayudantesIds.map(pid=>({registro_id:data.id,persona_id:pid})));
    if(sbErr(e2)) return;
  }
  DB.registros.push({id:data.id,personaId,obraId,areaId:persona.areaId,fecha,horas:Number(horas),ayudantesIds,incluyeJefe,piezas:Number(piezas||0),notas});
  const jornada=Number(DB.ajustes.jornadaEstandar||9.5);
  const involved=[...ayudantesIds]; if(incluyeJefe) involved.push(personaId);
  const avisos=involved.map(pid=>({pid,t:personaHorasHoyExistente(pid,fecha)})).filter(x=>x.t>jornada+0.01);
  if(avisos.length) toast('⚠ Revisar: '+avisos.map(a=>personaNombre(a.pid)+' ('+a.t.toFixed(1)+'h)').join(', '));
  else toast('Registro guardado ✓');
  render();
}

// ---------- INSTALACIÓN ----------
function ultimoRegistroHoy(personaId,obraId){
  const hoy=todayStr();
  const regs=DB.instalaciones.filter(r=>r.personaId===personaId&&r.obraId===obraId&&r.fecha===hoy)
    .sort((a,b)=>(a.salida||'').localeCompare(b.salida||''));
  return regs.length?regs[regs.length-1]:null;
}
function chipsCambios(r){
  if(!r.cambios||r.cambios.length===0) return '';
  return r.cambios.map(c=>`<span class="chip ${c.tipo==='salida'?'out':''}">${c.hora} · ${c.tipo==='incorporacion'?'+':'-'} ${personaNombre(c.personaId)}</span>`).join('');
}
function tripCompleto(r){ return r&&r.salida&&r.llegada&&r.salidaObra&&(r.llegadaTaller||r.vaAOtraObra); }
function origenViaje(r){ if(!r.vieneDe) return 'Taller'; const o=DB.instalaciones.find(x=>x.id===r.vieneDe); return o?obraNombre(o.obraId):'Otra obra'; }
function destinoViaje(r){ if(!r.vaAOtraObra) return 'Taller'; const d=DB.instalaciones.find(x=>x.vieneDe===r.id); return d?obraNombre(d.obraId):'Otra obra'; }
function renderInstalacionFlow(personaId,obraId){
  if(!obraId){ return `<div class="section-title">Registro de instalación</div><div class="empty" style="padding:20px 0;">Seleccioná la obra para empezar a registrar horarios.</div>`; }
  const ult=ultimoRegistroHoy(personaId,obraId);
  const persona=DB.personas.find(p=>p.id===personaId);

  const viejosSinCerrar=DB.instalaciones.filter(r=>r.personaId===personaId && r.fecha<todayStr() && !tripCompleto(r));
  const avisoViejos=viejosSinCerrar.length? viejosSinCerrar.map(r=>`<div class="alert-banner alert-crit"><span class="tag">⚠ Sin cerrar</span><span>Tenés un viaje del ${r.fecha} (${obraNombre(r.obraId)}) sin completar. Pedile al controlador que lo complete o elimine desde Reportes.</span></div>`).join('') : '';

  let previas='';
  const todasHoy=DB.instalaciones.filter(r=>r.personaId===personaId&&r.obraId===obraId&&r.fecha===todayStr()&&tripCompleto(r));
  if(todasHoy.length){
    previas=todasHoy.map(r=>{
      const ida=calcHoras(r.salida,r.llegada), vuelta=calcHoras(r.salidaObra,r.llegadaTaller), trabajo=trabajoBrutoHH(r), prep=tiempoPreparacion(r);
      return `<div class="trip-summary">
      <div class="t-row"><span>Equipo inicial</span><span>${contarPersonas(r)} persona(s)</span></div>
      ${prep>0?`<div class="t-row"><span>Preparación en taller (${DB.ajustes.horaEntradaTaller} → ${r.salida})</span><span>${prep.toFixed(1)}h</span></div>`:''}
      <div class="t-row"><span>${r.vieneDe?'Traslado desde '+origenViaje(r):'Salida taller'} → Llegada obra</span><span>${r.salida} → ${r.llegada} (${ida.toFixed(1)}h)</span></div>
      <div class="t-row"><span>Trabajo en obra (h-hombre, sin descontar almuerzo)</span><span>${trabajo.toFixed(1)}h</span></div>
      ${r.vaAOtraObra?`<div class="t-row"><span>Salida obra → siguió a ${destinoViaje(r)}</span><span>${r.salidaObra}</span></div>`:`<div class="t-row"><span>Salida obra → Llegada taller</span><span>${r.salidaObra} → ${r.llegadaTaller} (${vuelta.toFixed(1)}h)</span></div>`}
      ${r.detalle?`<div style="margin-top:6px;font-size:12px;color:var(--steel);">📝 ${r.detalle}</div>`:''}
      ${chipsCambios(r)?`<div style="margin-top:6px;">${chipsCambios(r)}</div>`:''}
    </div>`;}).join('');
  }
  const track=(activo)=>`<div class="journey-track"><div class="jstep ${activo>=1?'done':''}">Taller</div><div class="jstep ${activo>=2?'done':''}">→ Obra</div><div class="jstep ${activo>=3?'done':''}">Trabajo</div><div class="jstep ${activo>=4?'done':''}">→ Taller</div></div>`;

  if(!ult||tripCompleto(ult)){
    return `<div class="section-title">Registro de instalación · ${todayStr()}</div>
    ${avisoViejos}
    ${previas?`<div class="section-title" style="margin-top:0;">Viajes registrados hoy</div>${previas}`:''}
    <div class="card">${track(0)}
      <label>¿Quiénes van hacia la obra?</label>
      ${renderAyudantesChecklist('instalacion','ayu-check-ins')}
      <label class="check-row" style="margin-top:8px;"><input type="checkbox" id="ins-incluye-jefe" checked> Me incluyo yo también (${persona.nombre})</label>
      <button class="btn" onclick="registrarSalidaTaller('${personaId}','${obraId}')">▶ Registrar salida hacia obra</button>
    </div>`;
  }
  if(ult.salida&&!ult.llegada){
    return `<div class="section-title">Registro de instalación · ${todayStr()}</div>
    <div class="card">${track(1)}
      <div class="step-done"><span>${ult.vieneDe?'Salida desde '+origenViaje(ult)+' (traslado entre obras)':'Salida hacia obra'}</span><span>${ult.salida}</span></div>
      <div class="step-pending">Esperando llegada a obra… (equipo: ${contarPersonas(ult)} personas)</div>
      <button class="btn" onclick="registrarLlegadaObra('${personaId}','${obraId}')">📍 Registrar llegada a obra</button>
    </div>`;
  }
  if(ult.llegada&&!ult.salidaObra){
    const currentSet=miembrosActuales(ult);
    const roster=[...DB.personas.filter(p=>!esJefeRol(p.rol) && (estaActivo(p)||currentSet.has(p.id))), ...(esJefeRol(persona.rol)?[persona]:[])];
    const disponibles=roster.filter(p=>!currentSet.has(p.id));
    const presentes=roster.filter(p=>currentSet.has(p.id));
    const filasIncorporar=disponibles.length? disponibles.map(p=>`<label class="check-row"><input type="checkbox" class="camb-incorporar" value="${p.id}"> ${p.nombre}${p.id===personaId?' (vos)':''} <span class="badge ${areaInfo(p.areaId).badge}" style="margin-left:4px;">${areaInfo(p.areaId).nombre}</span></label>`).join('') : '<div class="empty" style="padding:6px 0;">No hay nadie más disponible para sumar.</div>';
    const filasRetirar=presentes.length? presentes.map(p=>`<label class="check-row"><input type="checkbox" class="camb-retirar" value="${p.id}"> ${p.nombre}${p.id===personaId?' (vos)':''}</label>`).join('') : '<div class="empty" style="padding:6px 0;">No hay nadie en obra para retirar.</div>';
    return `<div class="section-title">Registro de instalación · ${todayStr()}</div>
    <div class="card">${track(2)}
      <div class="step-done"><span>Salida hacia obra</span><span>${ult.salida}</span></div>
      <div class="step-done"><span>Llegada a obra / inicio de trabajo</span><span>${ult.llegada}</span></div>
      <div class="step-pending">Trabajo en curso · equipo actual: ${currentSet.size} persona(s)</div>
      ${chipsCambios(ult)?`<div>${chipsCambios(ult)}</div>`:''}
      <label style="margin-top:14px;">¿Se incorpora alguien? (podés marcar varios)</label>
      ${filasIncorporar}
      <label style="margin-top:14px;">¿Se retira alguien? (podés marcar varios)</label>
      ${filasRetirar}
      <button class="btn ghost" onclick="confirmarCambiosEquipo('${ult.id}')">Confirmar cambios de equipo</button>
      <label style="margin-top:18px;">Carpinterías instaladas en este trabajo (opcional)</label>
      <div class="row2">
        <div><input type="number" min="0" step="1" id="ins-carp-instaladas" placeholder="Cantidad instaladas"></div>
        <div><input type="number" min="0" step="1" id="ins-carp-mosquitero" placeholder="Con mosquitero"></div>
      </div>
      <label style="margin-top:14px;">Detalle de lo trabajado (opcional)</label>
      <textarea id="ins-detalle" placeholder="Ej: Se instalaron las ventanas del piso 3, quedó pendiente el sellado del baño…"></textarea>
      <label class="check-row" style="margin-top:14px;"><input type="checkbox" id="ins-otra-obra" onchange="document.getElementById('ins-otra-obra-box').style.display=this.checked?'block':'none'; document.getElementById('ins-btn-salida').textContent=this.checked?'⏩ Registrar salida hacia la otra obra':'⏹ Registrar salida de obra (hacia el taller)';"> Nos vamos directo a otra obra (sin pasar por el taller)</label>
      <div id="ins-otra-obra-box" style="display:none;">
        <label>¿A qué obra van?</label>
        <select id="ins-obra-destino"><option value="">Seleccioná la obra destino…</option>${obrasActivas().filter(o=>o.id!==obraId).map(o=>`<option value="${o.id}">${o.nombre}</option>`).join('')}</select>
        <div class="empty" style="padding:6px 0;text-align:left;">Va el equipo que está en obra ahora (${currentSet.size} persona(s)). El tiempo de traslado se carga a la obra destino.</div>
      </div>
      <button class="btn" id="ins-btn-salida" onclick="registrarSalidaObra('${personaId}','${obraId}')">⏹ Registrar salida de obra (hacia el taller)</button>
    </div>`;
  }
  if(ult.salidaObra&&!ult.llegadaTaller){
    return `<div class="section-title">Registro de instalación · ${todayStr()}</div>
    <div class="card">${track(3)}
      <div class="step-done"><span>Salida hacia obra</span><span>${ult.salida}</span></div>
      <div class="step-done"><span>Llegada a obra</span><span>${ult.llegada}</span></div>
      <div class="step-done"><span>Salida de obra hacia taller</span><span>${ult.salidaObra}</span></div>
      <div class="step-pending">Esperando llegada al taller…</div>
      <button class="btn" onclick="registrarLlegadaTaller('${personaId}','${obraId}')">🏠 Registrar llegada al taller</button>
    </div>`;
  }
}
async function registrarSalidaTaller(personaId,obraId){
  const ayudantesIds=Array.from(document.querySelectorAll('.ayu-check-ins:checked')).map(el=>el.value);
  const incluyeJefe=document.getElementById('ins-incluye-jefe').checked;
  if((ayudantesIds.length+(incluyeJefe?1:0))===0){ toast('Seleccioná al menos una persona para el viaje'); return; }
  const fecha=todayStr(), salida=nowTime();
  const {data,error}=await sb.from('instalaciones').insert({persona_id:personaId,obra_id:obraId,fecha,incluye_jefe:incluyeJefe,salida}).select().single();
  if(sbErr(error)) return;
  if(ayudantesIds.length){
    const {error:e2}=await sb.from('instalaciones_ayudantes').insert(ayudantesIds.map(pid=>({instalacion_id:data.id,persona_id:pid})));
    if(sbErr(e2)) return;
  }
  DB.instalaciones.push({id:data.id,personaId,obraId,fecha,ayudantesIds,incluyeJefe,salida,llegada:'',salidaObra:'',llegadaTaller:'',cambios:[]});
  toast('Salida hacia obra registrada ✓ '+salida); render();
}
async function registrarLlegadaObra(personaId,obraId){
  const ult=ultimoRegistroHoy(personaId,obraId);
  if(!ult||ult.llegada){ toast('No hay una salida pendiente'); return; }
  const hora=nowTime();
  const {error}=await sb.from('instalaciones').update({llegada:hora}).eq('id',ult.id);
  if(sbErr(error)) return;
  ult.llegada=hora;
  toast('Llegada a obra registrada ✓ '+hora+' — trabajo iniciado'); render();
}
async function confirmarCambiosEquipo(regId){
  const r=DB.instalaciones.find(x=>x.id===regId);
  if(!r||!r.llegada||r.salidaObra){ toast('No hay trabajo en curso'); return; }
  const incorporar=Array.from(document.querySelectorAll('.camb-incorporar:checked')).map(el=>el.value);
  const retirar=Array.from(document.querySelectorAll('.camb-retirar:checked')).map(el=>el.value);
  if(incorporar.length===0 && retirar.length===0){ toast('Marcá al menos una persona para incorporar o retirar'); return; }
  const hora=nowTime();
  const filas=[...incorporar.map(pid=>({instalacion_id:regId,persona_id:pid,hora,tipo:'incorporacion'})), ...retirar.map(pid=>({instalacion_id:regId,persona_id:pid,hora,tipo:'salida'}))];
  const {data,error}=await sb.from('instalaciones_cambios').insert(filas).select();
  if(sbErr(error)) return;
  r.cambios=r.cambios||[];
  (data||[]).forEach(d=>{ r.cambios.push({id:d.id,hora:t5(d.hora),tipo:d.tipo,personaId:d.persona_id}); });
  toast('Cambios registrados ✓ ('+filas.length+' persona(s), '+hora+')');
  render();
}
async function registrarSalidaObra(personaId,obraId){
  const ult=ultimoRegistroHoy(personaId,obraId);
  if(!ult||!ult.llegada||ult.salidaObra){ toast('No hay trabajo en curso'); return; }
  const instaladas=Number(document.getElementById('ins-carp-instaladas').value||0);
  const mosquitero=Number(document.getElementById('ins-carp-mosquitero').value||0);
  const detalle=document.getElementById('ins-detalle').value.trim();
  if(mosquitero>instaladas){ toast('Las carpinterías con mosquitero no pueden ser más que las instaladas'); return; }
  const otraObra=document.getElementById('ins-otra-obra') && document.getElementById('ins-otra-obra').checked;
  const destino=otraObra? document.getElementById('ins-obra-destino').value : '';
  if(otraObra && !destino){ toast('Elegí a qué obra van'); return; }
  const equipo=miembrosActuales(ult);
  if(otraObra && equipo.size===0){ toast('No hay nadie en obra para trasladar'); return; }
  const hora=nowTime();
  const upd={salida_obra:hora,carpinterias_instaladas:instaladas,carpinterias_mosquitero:mosquitero,detalle};
  if(otraObra) upd.va_a_otra_obra=true;
  const {error}=await sb.from('instalaciones').update(upd).eq('id',ult.id);
  if(error){ sbErr(error); if(otraObra && /va_a_otra_obra|column/i.test(error.message)) toast('Falta correr la migración SQL de traslados en Supabase'); return; }
  ult.salidaObra=hora; ult.carpinteriasInstaladas=instaladas; ult.carpinteriasMosquitero=mosquitero; ult.detalle=detalle;
  if(!otraObra){ toast('Salida de obra registrada ✓ '+hora); render(); return; }
  ult.vaAOtraObra=true;
  const incluyeJefe=equipo.has(personaId);
  const ayudantesIds=[...equipo].filter(id=>id!==personaId);
  const {data,error:e2}=await sb.from('instalaciones').insert({persona_id:personaId,obra_id:destino,fecha:ult.fecha,incluye_jefe:incluyeJefe,salida:hora,viene_de_instalacion:ult.id}).select().single();
  if(sbErr(e2)) return;
  if(ayudantesIds.length){
    const {error:e3}=await sb.from('instalaciones_ayudantes').insert(ayudantesIds.map(pid=>({instalacion_id:data.id,persona_id:pid})));
    if(sbErr(e3)) return;
  }
  DB.instalaciones.push({id:data.id,personaId,obraId:destino,fecha:ult.fecha,ayudantesIds,incluyeJefe,salida:hora,llegada:'',salidaObra:'',llegadaTaller:'',cambios:[],vaAOtraObra:false,vieneDe:ult.id,detalle:''});
  capObraId=destino;
  toast('Salida hacia '+obraNombre(destino)+' registrada ✓ '+hora); render();
}
async function registrarLlegadaTaller(personaId,obraId){
  const ult=ultimoRegistroHoy(personaId,obraId);
  if(!ult||!ult.salidaObra||ult.llegadaTaller){ toast('No hay un regreso pendiente'); return; }
  const hora=nowTime();
  const {error}=await sb.from('instalaciones').update({llegada_taller:hora}).eq('id',ult.id);
  if(sbErr(error)) return;
  ult.llegadaTaller=hora;
  toast('Llegada al taller registrada ✓ '+hora+' — viaje completo'); render();
}

// ---------- REPORTES ----------
function renderReportes(){
  if(!reportesFecha) reportesFecha=yesterdayStr();
  const fecha=reportesFecha, jornada=Number(DB.ajustes.jornadaEstandar||9.5);
  const personaIds=new Set();
  DB.registros.filter(r=>r.fecha===fecha).forEach(r=>{ if(r.incluyeJefe) personaIds.add(r.personaId); (r.ayudantesIds||[]).forEach(id=>personaIds.add(id)); });
  DB.instalaciones.filter(r=>r.fecha===fecha).forEach(r=>{ if(r.incluyeJefe) personaIds.add(r.personaId); (r.ayudantesIds||[]).forEach(id=>personaIds.add(id)); (r.cambios||[]).forEach(c=>personaIds.add(c.personaId)); });
  DB.mant.filter(m=>m.fecha===fecha).forEach(m=>mantMiembros(m).forEach(id=>personaIds.add(id)));

  let html=`<div class="card"><label>Fecha a revisar</label><input type="date" id="rep-fecha" value="${fecha}" onchange="reportesFecha=this.value; reportEditKey=null; agregandoInstalacionManual=false; render();"></div>`;

  html+=`<div class="card">
    <button class="btn ghost" onclick="agregandoInstalacionManual=!agregandoInstalacionManual; manualArea='vidrio'; render();">${agregandoInstalacionManual?'✕ Cancelar':'+ Agregar registro olvidado en esta fecha'}</button>
    ${agregandoInstalacionManual?renderRegistroManual():''}
  </div>`;
  if(personaIds.size===0){
    html+=`<div class="empty"><strong>Sin registros ese día</strong>Nadie cargó datos para la fecha seleccionada.</div>`;
    return html;
  }

  Array.from(personaIds).forEach(personaId=>{
    const persona=DB.personas.find(p=>p.id===personaId);
    const desglose=desglosePersonaFecha(personaId,fecha);
    const horasPersonales=Object.values(desglose).reduce((a,b)=>a+b,0);
    const regs=DB.registros.filter(r=>r.fecha===fecha && r.personaId===personaId);
    const insts=DB.instalaciones.filter(r=>r.fecha===fecha && r.personaId===personaId);

    let redFlags=[],warnFlags=[];
    insts.forEach(r=>{
      if(r.salida&&!r.llegada) redFlags.push(`Falta registrar llegada a obra (${obraNombre(r.obraId)}, salió ${r.salida})`);
      else if(r.llegada&&!r.salidaObra) redFlags.push(`Falta registrar salida de obra hacia el taller (${obraNombre(r.obraId)}, llegó ${r.llegada})`);
      else if(r.salidaObra&&!r.llegadaTaller&&!r.vaAOtraObra) redFlags.push(`Falta registrar llegada al taller (${obraNombre(r.obraId)}, salió de obra ${r.salidaObra})`);
    });
    const diff=horasPersonales-jornada;
    if(redFlags.length===0 && Math.abs(diff)>0.25) warnFlags.push(`Las horas no cuadran con la jornada de ${jornada}h: ${diff>0?'sobran':'faltan'} ${Math.abs(diff).toFixed(1)}h`);
    const status=redFlags.length?'crit':(warnFlags.length?'warn':'ok');

    html+=`<div class="report-card rc-${status}">
      <div class="report-head"><span class="name">${persona?persona.nombre:'—'} <span class="badge ${persona?areaInfo(persona.areaId).badge:''}">${persona?(esJefeRol(persona.rol)?persona.rol:'Ayudante · '+areaInfo(persona.areaId).nombre):''}</span></span><span class="horas">${horasPersonales.toFixed(1)}h / ${jornada}h</span></div>`;
    if(Object.keys(desglose).length){
      const escala=Math.max(horasPersonales,jornada,0.01);
      let left=0, segs='';
      Object.keys(desglose).forEach(obraId=>{
        const w=Math.min(desglose[obraId]/escala*100,100-left);
        segs+=`<div class="stack-seg" style="left:${left}%;width:${w}%;background:${colorForObra(obraId)};" title="${obraNombre(obraId)}: ${desglose[obraId].toFixed(1)}h"></div>`;
        left+=w;
      });
      const tickPos=Math.min(jornada/escala*100,100);
      html+=`<div class="stackbar-wrap"><div class="stackbar">${segs}<div class="stack-tick" style="left:${tickPos}%;" title="Jornada estándar: ${jornada}h"></div></div>
        <div class="stackbar-legend">${Object.keys(desglose).map(o=>`<span class="chip" style="background:${colorForObra(o)}22;border:1px solid ${colorForObra(o)};color:${colorForObra(o)};">${obraNombre(o)}: ${desglose[o].toFixed(1)}h</span>`).join('')}</div></div>`;
    }
    redFlags.forEach(f=> html+=`<div class="flag-line f-crit">⚠ ${f}</div>`);
    warnFlags.forEach(f=> html+=`<div class="flag-line f-warn">● ${f}</div>`);
    if(status==='ok') html+=`<div class="flag-line" style="color:var(--green);">✓ Datos completos y horas conformes</div>`;

    if(esJefeRol(persona ? persona.rol : '')){
      regs.forEach(r=>{
        const key='reg-'+r.id;
        const todosAyudantes=DB.personas.filter(p=>!esJefeRol(p.rol) && (estaActivo(p)||(r.ayudantesIds||[]).includes(p.id)));
        if(reportEditKey===key){
          html+=`<div class="detail-item">
            <label>Obra</label>
            <select id="edit-reg-obra-${r.id}">${selectObrasOpts(r.obraId)}</select>
            <label>Personas en este registro</label>
            ${todosAyudantes.map(a=>`<label class="check-row"><input type="checkbox" class="edit-ayu-${r.id}" value="${a.id}" ${ (r.ayudantesIds||[]).includes(a.id)?'checked':''}> ${a.nombre} <span class="badge ${areaInfo(a.areaId).badge}" style="margin-left:4px;">${areaInfo(a.areaId).nombre}</span></label>`).join('')}
            <label class="check-row"><input type="checkbox" id="edit-incluye-jefe-${r.id}" ${r.incluyeJefe?'checked':''}> Incluye al jefe</label>
            <div class="row2" style="margin-top:8px;"><div><label>Horas</label><input type="number" step="0.5" id="edit-reg-horas-${r.id}" value="${r.horas}"></div><div><label>Piezas</label><input type="number" id="edit-reg-piezas-${r.id}" value="${r.piezas}"></div></div>
            <div class="actions"><button class="btn small" onclick="saveRegistroEdit('${r.id}')">Guardar</button><button class="btn small ghost" onclick="reportEditKey=null; render();">Cancelar</button></div>
          </div>`;
        } else {
          html+=`<div class="detail-item">
            <div class="drow"><span>${areaInfo(r.areaId).nombre} · ${obraNombre(r.obraId)}</span><span>${r.horas}h × ${contarPersonas(r)} pers. · ${r.piezas} pzs</span></div>
            <div class="actions"><button class="btn small ghost" onclick="reportEditKey='${key}'; render();">Editar</button><button class="del" onclick="delRegistroFromReport('${r.id}')">Eliminar</button></div>
          </div>`;
        }
      });
      insts.forEach(r=>{
        const key='ins-'+r.id;
        if(reportEditKey===key){
          html+=`<div class="detail-item">
            <label>Obra</label>
            <select id="edit-ins-obra-${r.id}">${selectObrasOpts(r.obraId)}</select>
            <div class="row2"><div><label>Salida (${r.vieneDe?'desde '+origenViaje(r):'del taller'})</label><input type="time" id="edit-ins-salida-${r.id}" value="${r.salida||''}"></div><div><label>Llegada a obra</label><input type="time" id="edit-ins-llegada-${r.id}" value="${r.llegada||''}"></div></div>
            <div class="row2"><div><label>Salida de obra</label><input type="time" id="edit-ins-salidaobra-${r.id}" value="${r.salidaObra||''}"></div><div><label>Llegada al taller</label><input type="time" id="edit-ins-llegadataller-${r.id}" value="${r.llegadaTaller||''}"></div></div>
            <div class="row2"><div><label>Carpinterías instaladas</label><input type="number" min="0" step="1" id="edit-ins-carp-${r.id}" value="${r.carpinteriasInstaladas||0}"></div><div><label>Con mosquitero</label><input type="number" min="0" step="1" id="edit-ins-mosq-${r.id}" value="${r.carpinteriasMosquitero||0}"></div></div>
            <label class="check-row"><input type="checkbox" id="edit-ins-otra-${r.id}" ${r.vaAOtraObra?'checked':''}> Siguió directo a otra obra (no volvió al taller)</label>
            <label>Detalle de lo trabajado</label><textarea id="edit-ins-detalle-${r.id}">${r.detalle||''}</textarea>
            <label>Movimientos de personal</label>
            ${(r.cambios&&r.cambios.length)? r.cambios.map(c=>`<div class="drow">${c.hora} · ${c.tipo==='incorporacion'?'+':'-'} ${personaNombre(c.personaId)}<button class="del" onclick="delCambio('${r.id}','${c.id}')">Quitar</button></div>`).join('') : '<div class="meta">Sin movimientos</div>'}
            <div class="actions"><button class="btn small" onclick="editInsUpdate('${r.id}')">Guardar</button><button class="btn small ghost" onclick="reportEditKey=null; render();">Cancelar</button></div>
          </div>`;
        } else {

let cierreObraId=null;
function rankingAreas(obraId){
  const rate=Number(DB.ajustes.costoHora||0);
  const ins=horasInstalacionDetalle(obraId);
  const insHoras=ins.ida+ins.vuelta+ins.trabajo+ins.preparacion;
  const areas=[
    {nombre:'Vidrio',horas:horasArea(obraId,'vidrio')},
    {nombre:'Carpintería',horas:horasArea(obraId,'carpinteria')},
    {nombre:'Instalación',horas:insHoras}
  ];
  areas.forEach(a=>a.costo=a.horas*rate);
  areas.sort((a,b)=>b.horas-a.horas);
  return areas;
}
function renderRankingAreas(obraId){
  const areas=rankingAreas(obraId);
  const max=Math.max(areas[0]?areas[0].horas:0,0.01);
  return areas.map((a,i)=>`<div class="gauge-wrap">
    <div class="gauge-head"><span>${i+1}. ${a.nombre}</span><span class="pct">${a.horas.toFixed(1)}h-hombre · $${a.costo.toFixed(0)}</span></div>
    <div class="gauge status-ok"><div class="gauge-fill" style="width:${(a.horas/max*100).toFixed(1)}%;background:${PALETA[i%PALETA.length]};"></div></div>
  </div>`).join('');
}
function tablaProduccion(obraId){
  const map={};
  DB.registros.filter(r=>r.obraId===obraId).forEach(r=>{
    const key=r.fecha+'|'+r.areaId;
    if(!map[key]) map[key]={fecha:r.fecha,areaId:r.areaId,horas:0,piezas:0};
    map[key].horas+=Number(r.horas||0)*contarPersonas(r);
    map[key].piezas+=Number(r.piezas||0);
  });
  return Object.values(map).sort((a,b)=>a.fecha.localeCompare(b.fecha)||a.areaId.localeCompare(b.areaId));
}
function tablaInstalacion(obraId){
  return DB.instalaciones.filter(r=>r.obraId===obraId&&r.salida).sort((a,b)=>a.fecha.localeCompare(b.fecha)||a.salida.localeCompare(b.salida)).map(r=>({
    fecha:r.fecha, maestro:personaNombre(r.personaId), personas:contarPersonas(r), desde:origenViaje(r), hacia:destinoViaje(r),
    prep:tiempoPreparacion(r), ida:calcHoras(r.salida,r.llegada), trabajoNeto:trabajoBrutoHH(r),

function renderEstadoObrasActivas(){
  const rate=Number(DB.ajustes.costoHora||0);
  let html='';
  if(rate===0) html+=`<div class="alert-banner alert-warn no-print"><span class="tag">● Atención</span><span>No hay costo por hora configurado. Definilo en Config → Ajustes.</span></div>`;
  const filas=obrasActivas().map(o=>{
    const pres=presupuestoTotales(o.id), hh=horasHombreTotalesObra(o.id), costo=hh*rate;
    const pctH=pres.horas>0?hh/pres.horas*100:null, pctM=pres.monto>0?costo/pres.monto*100:null;
    const peor=Math.max(pctH||0,pctM||0);
    return {o,pctH,pctM,peor};
  }).sort((a,b)=>b.peor-a.peor);
  if(!filas.length) return html;
  html+=`<div class="section-title no-print">Estado de obras activas</div><div class="card no-print">`+filas.map(f=>{
    const st=f.peor>=100?'crit':(f.peor>=80?'warn':'ok');
    const color=st==='crit'?'#B4585A':(st==='warn'?'#C8892F':'var(--steel)');
    const txt=(f.pctH===null&&f.pctM===null)?'sin presupuesto':`${f.pctH!==null?f.pctH.toFixed(0)+'% horas':''}${f.pctH!==null&&f.pctM!==null?' · ':''}${f.pctM!==null?f.pctM.toFixed(0)+'% costo':''}`;
    return `<div class="list-item" style="cursor:pointer;" onclick="cierreObraId='${f.o.id}'; render();"><span>${st!=='ok'?(st==='crit'?'⚠ ':'● '):''}${f.o.nombre}</span><span class="meta" style="color:${color};font-weight:600;">${txt}</span></div>`;
  }).join('')+`<div class="empty" style="padding:8px 0 0;text-align:left;">Alerta a partir de 80% (●) y 100% (⚠) del presupuesto. Tocá una obra para ver su cierre.</div></div>`;
  return html;
}
function exportarCierreExcel(){
  const obra=DB.obras.find(o=>o.id===cierreObraId); if(!obra){ toast('Seleccioná una obra'); return; }
  const pres=presupuestoTotales(cierreObraId), ins=horasInstalacionDetalle(cierreObraId), carp=carpinteriasObra(cierreObraId), rate=Number(DB.ajustes.costoHora||0);
  const hhTotal=horasHombreTotalesObra(cierreObraId);

  const resumen=[
    ['Obra',obra.nombre],['Cliente',obra.cliente||''],['Informe generado',todayStr()],['Costo por hora (por persona)',rate],[],
    ['CONCEPTO','HORAS-HOMBRE','COSTO'],
    ['Vidrio',horasArea(cierreObraId,'vidrio'),horasArea(cierreObraId,'vidrio')*rate],
    ['Carpintería',horasArea(cierreObraId,'carpinteria'),horasArea(cierreObraId,'carpinteria')*rate],
    ['Instalación · Preparación',ins.preparacion,ins.preparacion*rate],
    ['Instalación · Transporte ida',ins.ida,ins.ida*rate],
    ['Instalación · Trabajo neto (almuerzo descontado)',ins.trabajo,ins.trabajo*rate],
    ['Instalación · Transporte vuelta',ins.vuelta,ins.vuelta*rate],
    ['TOTAL',hhTotal,hhTotal*rate],[],
    ['PRESUPUESTO','',''],
    ['Horas presupuestadas',pres.horas,''],['Monto presupuestado','',pres.monto],['Carpinterías presupuestadas',pres.carpinterias,''],
    ['Carpinterías instaladas',carp.instaladas,''],['Con mosquitero',carp.mosquitero,''],
    ['% horas consumidas', pres.horas>0? hhTotal/pres.horas : '', ''],
    ['% costo consumido', '', pres.monto>0? (hhTotal*rate)/pres.monto : '']
  ];

  const taller=[['Fecha','Área','Jefe','Personas','Incluye jefe','Ayudantes','Horas (por persona)','Horas-hombre','Piezas','Notas']];
  DB.registros.filter(r=>r.obraId===cierreObraId).sort((a,b)=>a.fecha.localeCompare(b.fecha)).forEach(r=>{
    taller.push([r.fecha,areaInfo(r.areaId).nombre,personaNombre(r.personaId),contarPersonas(r),r.incluyeJefe?'Sí':'No',(r.ayudantesIds||[]).map(personaNombre).join(', '),r.horas,r.horas*contarPersonas(r),r.piezas,r.notas||'']);
  });

  const instal=[['Fecha','Maestro','Personas iniciales','Incluye maestro','Ayudantes iniciales','Desde','Hacia (al salir)','Salida','Llegada obra','Salida obra','Llegada taller','Preparación (h)','Ida (h)','Trabajo bruto (h-h)','Vuelta (h)','Carp. instaladas','Con mosquitero','Movimientos','Detalle']];
  DB.instalaciones.filter(r=>r.obraId===cierreObraId).sort((a,b)=>a.fecha.localeCompare(b.fecha)||(a.salida||'').localeCompare(b.salida||'')).forEach(r=>{
    const movs=(r.cambios||[]).map(c=>`${c.hora} ${c.tipo==='incorporacion'?'+':'-'}${personaNombre(c.personaId)}`).join('; ');
    instal.push([r.fecha,personaNombre(r.personaId),contarPersonas(r),r.incluyeJefe?'Sí':'No',(r.ayudantesIds||[]).map(personaNombre).join(', '),origenViaje(r),destinoViaje(r),r.salida||'',r.llegada||'',r.salidaObra||'',r.llegadaTaller||'',tiempoPreparacion(r),calcHoras(r.salida,r.llegada),trabajoBrutoHH(r),calcHoras(r.salidaObra,r.llegadaTaller),r.carpinteriasInstaladas||0,r.carpinteriasMosquitero||0,movs,r.detalle||'']);
  });

  const wb=XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(resumen),'Resumen');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(taller),'Taller');
  XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(instal),'Instalacion');
  const nombreArchivo=`cierre-${obra.nombre.replace(/[^a-z0-9]/gi,'_').toLowerCase()}-${todayStr()}.xlsx`;
  XLSX.writeFile(wb,nombreArchivo);
  toast('Excel descargado ✓');
}

let mantForm=null;
async function invocarFn(body){
  const {data,error}=await sb.functions.invoke('mantenimientos',{body});
  if(error){
    let msg=error.message;
    try{ const j=await error.context.json(); if(j&&j.error) msg=j.error; }catch(_){}

  }
  if(data&&data.error&&!('ok' in data)) throw new Error(data.error);

function mantFormNuevo(){
  const enc=encargadosMant();
  return {encargadoId:enc.length===1?enc[0].id:'', fecha:todayStr(), obraTexto:'', notionObraId:null, direccion:'',
    garantia:false, incluye:true, ayudantes:[], items:[], mallas:[], detalle:'', ingreso:'', salida:'', transporte:''};
}
function encargadosMant(){ return DB.personas.filter(p=>p.areaId==='mantenimiento' && p.rol==='Encargado de Mantenimiento' && estaActivo(p)); }
function minutosEntre(a,b){
  if(!a||!b) return 0;
  const [ah,am]=String(a).split(':').map(Number),[bh,bm]=String(b).split(':').map(Number);
  const d=(bh*60+bm)-(ah*60+am); return d>0?d:0;
}
function mantMiembros(m){ const s=[...(m.ayudantesIds||[])]; if(m.incluyeJefe) s.push(m.personaId); return s; }
function horasMantPersona(m,pid){ return mantMiembros(m).includes(pid)? (minutosEntre(m.horaIngreso,m.horaSalida)+Number(m.transporteMin||0))/60 : 0; }
// MISMA fórmula que la función de Supabase (calc.ts)
function calcMantenimiento(m){
  const personas=mantMiembros(m).length;
  const tc=Number(m.tipoCambio||0), ph=Number(m.precioHoraBs||0), factor=Number(m.factor||0);
  const horasTrabajo=minutosEntre(m.horaIngreso,m.horaSalida)/60, horasTransporte=Number(m.transporteMin||0)/60;
  const itemsUsd=(m.items||[]).reduce((s,i)=>s+Number(i.precioUsd||0)*Number(i.cantidad),0);
  const itemsPendientes=(m.items||[]).filter(i=>i.precioUsd===null||i.precioUsd===undefined).length;
  const mallasM2=(m.mallas||[]).reduce((s,x)=>s+(Number(x.anchoMm)/1000)*(Number(x.altoMm)/1000)*Number(x.cantidad),0);
  const mallasBs=(m.mallas||[]).reduce((s,x)=>s+(Number(x.anchoMm)/1000)*(Number(x.altoMm)/1000)*Number(x.cantidad)*Number(x.precioM2Bs),0);
  const itemsBs=itemsUsd*tc, manoObraBs=horasTrabajo*personas*ph, transporteBs=horasTransporte*personas*ph;
  const subtotalBs=itemsBs+mallasBs+manoObraBs+transporteBs;
  // Total oficial = suma de las líneas de la proforma (precio unitario con factor, redondeado a centavos). Misma regla en la función de Notion (calc.ts).
  const R=n=>Math.round((Number(n)+Number.EPSILON)*100)/100;
  const lineas=[];
  (m.items||[]).forEach(i=>{ const pend=i.precioUsd===null||i.precioUsd===undefined; const pu=pend?null:R(Number(i.precioUsd)*tc*factor); lineas.push({tipo:'item',ref:i,cant:Number(i.cantidad),pu,imp:pend?null:R(pu*Number(i.cantidad))}); });
  (m.mallas||[]).forEach(x=>{ const a=(Number(x.anchoMm)/1000)*(Number(x.altoMm)/1000); const pu=R(a*Number(x.precioM2Bs)*factor); lineas.push({tipo:'malla',ref:x,m2:a,cant:Number(x.cantidad),pu,imp:R(pu*Number(x.cantidad))}); });
  const puH=R(ph*factor), hhT=R(horasTrabajo*personas), hhV=R(horasTransporte*personas);
  if(hhT>0) lineas.push({tipo:'trabajo',cant:hhT,pu:puH,imp:R(hhT*puH)});
  if(hhV>0) lineas.push({tipo:'transporte',cant:hhV,pu:puH,imp:R(hhV*puH)});
  const totalBs=R(lineas.reduce((t,l)=>t+(l.imp||0),0));
  return {personas,horasTrabajo,horasTransporte,itemsUsd,itemsPendientes,itemsBs,mallasM2,mallasBs,manoObraBs,transporteBs,subtotalBs,totalBs,cobroClienteBs:m.garantia?0:totalBs,lineas};
}
const fmtNum=(n,d=2)=>Number(n||0).toLocaleString('es-BO',{minimumFractionDigits:d,maximumFractionDigits:d});
const fmtBs=n=>'Bs '+fmtNum(n);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function obraLabelNotion(o){ return o.nombre+(o.codigoCliente?' · '+o.codigoCliente:''); }
function mantCodigo(m){ return m.codigoM?('M'+m.codigoM):'M—'; }
function chipNotion(m){
  if(m.notionEstado==='ok') return `<span class="chip" style="background:var(--green-soft);color:#2F5A40;">Notion ✓</span>`;
  if(m.notionEstado==='error') return `<span class="chip out" title="${esc(m.notionError||'')}">Notion: error</span>`;

function mantObraInput(v){
  mantForm.obraTexto=v;

  mantForm.notionObraId=o?o.id:null;
  if(o && o.direccion && !mantForm.direccion){ mantForm.direccion=o.direccion; const d=document.getElementById('mant-direccion'); if(d) d.value=o.direccion; }

// Acompañantes: primero el equipo de mantenimiento; después el resto agrupado por área (áreas y nombres en orden alfabético)
function mantGruposEquipo(lista){
  const cmp=(a,b)=>a.localeCompare(b,'es',{sensitivity:'base'});
  const grupos={};
  lista.forEach(p=>{ (grupos[p.areaId||'']=grupos[p.areaId||'']||[]).push(p); });
  Object.values(grupos).forEach(g=>g.sort((a,b)=>cmp(a.nombre,b.nombre)));
  const ids=Object.keys(grupos).sort((a,b)=> (a==='mantenimiento'?-1:b==='mantenimiento'?1:cmp(areaInfo(a).nombre,areaInfo(b).nombre)));
  return ids.map(id=>({titulo:id==='mantenimiento'?'Equipo de mantenimiento':areaInfo(id).nombre, personas:grupos[id]}));
}
function mantToggleAyudante(id,on){ const s=new Set(mantForm.ayudantes); on?s.add(id):s.delete(id); mantForm.ayudantes=[...s]; }
function renderMantItemResultados(q){
  q=(q||'').trim().toLowerCase();
  if(q.length<2) return '';
  const res=DB.mantItems.filter(i=>i.activo && (i.codigo.toLowerCase().includes(q)||i.descripcion.toLowerCase().includes(q))).slice(0,15);
  if(!res.length) return `<div class="meta" style="padding:8px 0;">Sin coincidencias. Si la pieza no está en la lista, anotala en el detalle.</div>`;
  return res.map(i=>`<div class="list-item"><span><b>${esc(i.codigo)}</b><br><span class="meta">${esc(i.descripcion)}</span></span><button class="btn small" onclick="mantAgregarItem('${i.id}')">+ Agregar</button></div>`).join('');
}
function mantAgregarItem(id){
  const it=DB.mantItems.find(i=>i.id===id); if(!it) return;
  const ex=mantForm.items.find(x=>x.itemId===id);
  if(ex) ex.cantidad=Number(ex.cantidad)+1; else mantForm.items.push({itemId:id,codigo:it.codigo,descripcion:it.descripcion,precioUsd:it.precioUsd,cantidad:1});
  document.getElementById('mant-items-sel').innerHTML=renderMantItemsSel();
  toast(it.codigo+' agregado');
}
function mantAgregarManual(){
  const d=document.getElementById('mant-man-desc'), c=document.getElementById('mant-man-cant');
  const desc=(d.value||'').trim(), cant=Number(c.value);
  if(!desc) return toast('Escribí la descripción de la pieza');
  if(!(cant>0)) return toast('Poné la cantidad');
  mantForm.items.push({itemId:null,codigo:'MANUAL',descripcion:desc,precioUsd:null,cantidad:cant,esManual:true});
  d.value=''; c.value='';
  document.getElementById('mant-items-sel').innerHTML=renderMantItemsSel();
  toast('Pieza manual agregada');
}
function mantAgregarMalla(){
  const a=Number(document.getElementById('malla-ancho').value), h=Number(document.getElementById('malla-alto').value), c=Number(document.getElementById('malla-cant').value||1);
  if(!(a>0)||!(h>0)) return toast('Completá ancho y alto en milímetros');
  if(a>6000||h>6000) return toast('Revisá la medida: tiene que estar en milímetros');
  if(!(c>0)) return toast('Cantidad inválida');
  mantForm.mallas.push({anchoMm:a,altoMm:h,cantidad:c});
  document.getElementById('malla-ancho').value=''; document.getElementById('malla-alto').value=''; document.getElementById('malla-cant').value='1';
  document.getElementById('mant-mallas-sel').innerHTML=renderMantMallasSel();
}
function renderMantMallasSel(){

async function guardarMantenimiento(){
  const f=mantForm;
  if(!f.encargadoId) return toast('Elegí el encargado');
  if(!f.fecha) return toast('Elegí la fecha');
  if(!f.obraTexto.trim()) return toast('Escribí o elegí la obra');
  if(!f.direccion.trim()) return toast('Completá la dirección');
  if(!f.detalle.trim()) return toast('Escribí el detalle del trabajo');
  if(!f.ingreso||!f.salida) return toast('Completá hora de ingreso y de salida');
  if(minutosEntre(f.ingreso,f.salida)<=0) return toast('La hora de salida tiene que ser posterior al ingreso');
  if(f.transporte===''||Number(f.transporte)<0) return toast('Completá los minutos de transporte (0 si no hubo)');
  if((f.ayudantes.length+(f.incluye?1:0))===0) return toast('Seleccioná al menos una persona');
  if(f.items.some(x=>!(Number(x.cantidad)>0))) return toast('Revisá las cantidades de las piezas');
  const btn=document.getElementById('btn-guardar-mant'); if(btn){ btn.disabled=true; btn.textContent='Guardando…'; }
  const nombre=f.notionObraId? (DB.notionObras.find(o=>o.id===f.notionObraId)||{}).nombre||f.obraTexto : f.obraTexto.trim();
  const {data,error}=await sb.from('mantenimientos').insert({
    fecha:f.fecha, persona_id:f.encargadoId, incluye_jefe:f.incluye, notion_obra_id:f.notionObraId, obra_nombre:nombre,
    direccion:f.direccion.trim(), garantia:f.garantia, detalle:f.detalle.trim(), hora_ingreso:f.ingreso, hora_salida:f.salida,
    transporte_min:Math.round(Number(f.transporte)), precio_hora_bs:Number(DB.ajustes.precioHoraMantBs||0), factor:Number(DB.ajustes.factorMant||1.508),
    tipo_cambio:DB.ajustes.tipoCambio||null
  }).select().single();
  if(sbErr(error)){ if(btn){btn.disabled=false; btn.textContent='Guardar mantenimiento';} return; }
  if(f.ayudantes.length){ const {error:e}=await sb.from('mantenimientos_ayudantes').insert(f.ayudantes.map(pid=>({mantenimiento_id:data.id,persona_id:pid}))); sbErr(e); }
  if(f.items.length){ const {error:e}=await sb.from('mantenimientos_items').insert(f.items.map(x=>({mantenimiento_id:data.id,item_id:x.itemId,codigo:x.codigo,descripcion:x.descripcion,precio_usd:x.esManual?null:x.precioUsd,cantidad:Number(x.cantidad),es_manual:!!x.esManual}))); sbErr(e); }
  if(f.mallas.length){ const {error:e}=await sb.from('mantenimientos_mallas').insert(f.mallas.map(x=>({mantenimiento_id:data.id,ancho_mm:x.anchoMm,alto_mm:x.altoMm,cantidad:x.cantidad,precio_m2_bs:Number(DB.ajustes.precioMallaBsM2||90)}))); sbErr(e); }
  mantForm=mantFormNuevo(); mantForm.encargadoId=f.encargadoId;
  await recargarMant(); render();
  toast('Guardado ✓ Enviando a Notion…');
  await sincronizarMant(data.id, true);
}
async function sincronizarMant(id, silencioso){
  try{
    const data=await invocarFn({action:'sincronizar',id});
    await recargarMant(); render();
    if(data && data.ok && data.actualizado) toast(`M${data.codigo_m} actualizado en Notion ✓`);
    else if(data && data.ok) toast(`M${data.codigo_m} registrado en Notion ✓`);
    else if(data && data.ya_sincronizado) toast('Ya estaba en Notion');
    else toast('Guardado, pero Notion falló: '+((data&&data.error)||'error desconocido'));
  }catch(e){ await recargarMant(); render(); toast('Guardado. Notion quedó pendiente: '+(e.message||e)); }
}
async function recargarMant(){
  const [mR,aR,iR,lR]=await Promise.all([sb.from('mantenimientos').select('*'),sb.from('mantenimientos_ayudantes').select('*'),sb.from('mantenimientos_items').select('*'),sb.from('mantenimientos_mallas').select('*')]);
  if(sbErr(mR.error)||sbErr(aR.error)||sbErr(iR.error)||sbErr(lR.error)) return;
  const ay={}, it={}, ml={};
  (lR.data||[]).forEach(r=>{(ml[r.mantenimiento_id]=ml[r.mantenimiento_id]||[]).push({id:r.id,anchoMm:Number(r.ancho_mm),altoMm:Number(r.alto_mm),cantidad:Number(r.cantidad),precioM2Bs:Number(r.precio_m2_bs)});});
  (aR.data||[]).forEach(r=>{(ay[r.mantenimiento_id]=ay[r.mantenimiento_id]||[]).push(r.persona_id);});
  (iR.data||[]).forEach(r=>{(it[r.mantenimiento_id]=it[r.mantenimiento_id]||[]).push({id:r.id,itemId:r.item_id,codigo:r.codigo,descripcion:r.descripcion,precioUsd:r.precio_usd==null?null:Number(r.precio_usd),cantidad:Number(r.cantidad),esManual:!!r.es_manual});});
  DB.mant=(mR.data||[]).map(r=>({id:r.id,codigoM:r.codigo_m,fecha:r.fecha,personaId:r.persona_id,incluyeJefe:r.incluye_jefe,notionObraId:r.notion_obra_id,
    obraNombre:r.obra_nombre,direccion:r.direccion,garantia:r.garantia,detalle:r.detalle,horaIngreso:t5(r.hora_ingreso),horaSalida:t5(r.hora_salida),
    transporteMin:Number(r.transporte_min||0),tipoCambio:r.tipo_cambio==null?null:Number(r.tipo_cambio),precioHoraBs:Number(r.precio_hora_bs||0),factor:Number(r.factor||0),
    notionPageId:r.notion_page_id,notionEstado:r.notion_estado,notionError:r.notion_error,createdAt:r.created_at||'',ayudantesIds:ay[r.id]||[],items:it[r.id]||[],mallas:ml[r.id]||[]}));
}
async function recargarCatalogos(){
  const [cR,oR]=await Promise.all([sb.from('mant_items').select('*').order('codigo'),sb.from('notion_obras').select('*').order('nombre')]);
  if(!cR.error) DB.mantItems=(cR.data||[]).map(r=>({id:r.id,codigo:r.codigo,descripcion:r.descripcion,precioUsd:Number(r.precio_usd),activo:r.activo}));
  if(!oR.error){ DB.notionObras=(oR.data||[]).map(r=>({id:r.notion_page_id,nombre:r.nombre,codigoCliente:r.codigo_cliente,direccion:r.direccion,estado:r.estado,updatedAt:r.updated_at})); }
}

function proformaLineas(m){
  const c=calcMantenimiento(m), tec=n=>`${n} técnico${n===1?'':'s'}`;
  const L=c.lineas.map(l=>{
    if(l.tipo==='item') return {...l,grupo:'Piezas',unidad:'u',desc:l.ref.descripcion};
    if(l.tipo==='malla') return {...l,grupo:'Piezas',unidad:'u',desc:`Malla mosquitera ${fmtNum(l.ref.anchoMm,0)} × ${fmtNum(l.ref.altoMm,0)} mm (${fmtNum(l.m2,3)} m²)`};
    if(l.tipo==='trabajo') return {...l,grupo:'Servicio',unidad:'h',desc:`Mano de obra en obra (${fmtNum(c.horasTrabajo)} h × ${tec(c.personas)})`};
    return {...l,grupo:'Servicio',unidad:'h',desc:`Transporte (${fmtNum(c.horasTransporte)} h × ${tec(c.personas)})`};
  });
  return {L,total:c.totalBs,c};
}
function renderProformaMant(m){
  const {L,total,c}=proformaLineas(m);
  const fila=l=>`<tr><td>${esc(l.desc)}</td><td class="r">${l.unidad==='h'?fmtNum(l.cant)+' h':fmtNum(l.cant,0)}</td><td class="r">${l.pu==null?'a confirmar':fmtBs(l.pu)}</td><td class="r">${l.imp==null?'a confirmar':fmtBs(l.imp)}</td></tr>`;
  const piezas=L.filter(l=>l.grupo==='Piezas'), serv=L.filter(l=>l.grupo==='Servicio');
  const tabla=(t,arr)=>arr.length?`<div class="pf-sec">${t}</div><table class="pf-tabla"><thead><tr><th>Descripción</th><th class="r">Cant.</th><th class="r">Precio unit.</th><th class="r">Importe</th></tr></thead><tbody>${arr.map(fila).join('')}</tbody></table>`:'';
  return `<div class="print-only proforma">
    <div class="pf-head"><img src="${LOGO_TS}" alt="Tecnosuisse"><div class="pf-doc"><div class="t">PROFORMA DE MANTENIMIENTO</div><div class="n">${mantCodigo(m)}</div><div class="f">Fecha: ${fechaLarga(m.fecha)}</div></div></div>
    <div class="pf-datos"><b>Cliente / obra</b><span>${esc(m.obraNombre)}</span><b>Dirección</b><span>${esc(m.direccion||'—')}</span></div>
    <div class="pf-sec">Trabajo realizado</div><div class="pf-detalle">${esc(m.detalle||'—')}</div>
    ${tabla('Piezas y materiales',piezas)}
    ${tabla('Servicio técnico',serv)}
    <div class="pf-tot">
      ${m.garantia?`<div class="g"><span>Total del servicio</span><span>${fmtBs(total)}</span></div><div class="g"><span>Cubierto por garantía</span><span>− ${fmtBs(total)}</span></div><div class="fin"><span>TOTAL A PAGAR</span><span>Bs 0,00</span></div>`
        :`<div class="fin"><span>${c.itemsPendientes?'TOTAL (parcial)':'TOTAL'}</span><span>${fmtBs(total)}</span></div>`}
    </div>
    ${c.itemsPendientes?`<div class="pf-nota"><b>Atención:</b> hay ${c.itemsPendientes} pieza(s) con precio a confirmar; el total no es definitivo.</div>`:''}
    <div class="pf-nota">Precios en bolivianos (Bs).${m.garantia?' Este mantenimiento está cubierto por la garantía de Tecnosuisse.':''}</div>
  </div>`;
}
function fechaLarga(f){ if(!f) return '—'; const [y,mo,d]=f.split('-'); return `${d}/${mo}/${y}`; }
function mantExportarProforma(id){
  const m=DB.mant.find(x=>x.id===id); if(!m) return;
  const c=calcMantenimiento(m);
  if(!m.tipoCambio) return toast('Falta el tipo de cambio: no se puede armar la proforma.');
  if(c.itemsPendientes && !confirm(`Hay ${c.itemsPendientes} pieza(s) sin precio. La proforma saldrá con "a confirmar" y total parcial. ¿Exportar igual?`)) return;
  const t=document.title; document.title='Proforma '+mantCodigo(m)+' - '+(m.obraNombre||'');
  window.print(); setTimeout(()=>document.title=t,1000);
}
async function mantGuardarPreciosManuales(id){
  const m=DB.mant.find(x=>x.id===id); if(!m) return;
  const upd=[];
  for(const i of m.items.filter(x=>x.esManual)){
    const el=document.getElementById('pi-'+i.id); const v=el.value===''?null:Number(el.value);
    if(v!==null && !(v>=0)) return toast('Precio inválido en '+i.descripcion);
    upd.push({id:i.id,precio_usd:v});
  }
  for(const u of upd){ const {error}=await sb.from('mantenimientos_items').update({precio_usd:u.precio_usd}).eq('id',u.id); if(sbErr(error)) return; }
  await recargarMant(); render(); toast('Precios guardados ✓');
  if(m.notionEstado==='ok') await sincronizarMant(id);
}
async function mantGuardarTc(id){
  const v=Number(document.getElementById('mant-tc').value);
  if(!(v>0)) return toast('Tipo de cambio inválido');
  const {error}=await sb.from('mantenimientos').update({tipo_cambio:v}).eq('id',id);
  if(sbErr(error)) return; await recargarMant(); render(); toast('Tipo de cambio guardado ✓');
  const m=DB.mant.find(x=>x.id===id); if(m && m.notionEstado==='ok') await sincronizarMant(id);
}
async function mantAplicarAjustes(id){
  if(!confirm('¿Recalcular este mantenimiento con el precio por hora y el factor actuales?')) return;
  const {error}=await sb.from('mantenimientos').update({precio_hora_bs:Number(DB.ajustes.precioHoraMantBs||0),factor:Number(DB.ajustes.factorMant||1.508)}).eq('id',id);
  if(sbErr(error)) return; await recargarMant(); render(); toast('Recalculado ✓');
  const m=DB.mant.find(x=>x.id===id); if(m && m.notionEstado==='ok') await sincronizarMant(id);
}
async function borrarMant(id){
  if(!confirm('¿Eliminar este mantenimiento? No se puede deshacer.')) return;
  const {error}=await sb.from('mantenimientos').delete().eq('id',id);
  if(sbErr(error)) return; cierreMantId=null; await recargarMant(); render(); toast('Eliminado');
}

function renderMantCatalogo(){
