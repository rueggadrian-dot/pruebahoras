    <div class="area-mini"><span>× Factor ${fmtNum(m.factor,3)} (suma de las líneas de la proforma, redondeadas)</span><span><b>${fmtBs(c.totalBs)}</b></span></div>
  </div>
  <div class="totales-box"><span>${m.garantia?'Cobro al cliente (garantía)':'Total a cobrar'}</span><span>${fmtBs(c.cobroClienteBs)}</span></div>
  ${m.garantia?`<div class="totales-box" style="background:var(--steel);"><span>Costo interno de la garantía</span><span>${fmtBs(c.totalBs)}</span></div>`:''}
  <div class="no-print">
    <div class="card">
      <label>Tipo de cambio (Bs/USD)</label>
      <div class="row2"><input type="number" step="0.01" min="0" id="mant-tc" value="${m.tipoCambio||''}"><button class="btn small ghost" style="margin:0;" onclick="document.getElementById('mant-tc').value=DB.ajustes.tipoCambio||''">Usar el de Config (${DB.ajustes.tipoCambio?fmtNum(DB.ajustes.tipoCambio):'—'})</button></div>
      <button class="btn ghost" onclick="mantGuardarTc('${m.id}')">Guardar tipo de cambio</button>
      <button class="btn ghost" onclick="mantAplicarAjustes('${m.id}')">Aplicar precio/hora y factor actuales (${fmtBs(DB.ajustes.precioHoraMantBs)} · ${fmtNum(DB.ajustes.factorMant,3)})</button>
      ${!m.obraId?renderMantSinObra(m):''}
      ${m.notionEstado!=='ok'?`<button class="btn ghost" onclick="sincronizarMant('${m.id}')">Reintentar envío a Notion</button>${m.notionError?`<div class="flag-line f-crit">${esc(m.notionError)}</div>`:''}`:''}
      <button class="btn" onclick="mantExportarProforma('${m.id}')">🖨 Exportar proforma a PDF</button>
      ${m.notionEstado!=='ok'?`<button class="del" style="margin-top:10px;" onclick="borrarMant('${m.id}')">Eliminar este mantenimiento</button>`:''}
    </div>
  </div></div>`;
}
// ---------- PROFORMA PARA EL CLIENTE (PDF) ----------
// Cada línea ya incluye el factor; no se muestran factor, TC ni costos internos.
function proformaLineas(m){
  const c=calcMantenimiento(m), tec=n=>`${n} técnico${n===1?'':'s'}`;
  const L=c.lineas.map(l=>{
    if(l.tipo==='item') return {...l,grupo:'Piezas',unidad:'u',desc:l.ref.descripcion};
    if(l.tipo==='malla') return {...l,grupo:'Piezas',unidad:'u',desc:`Malla mosquitera ${fmtNum(l.ref.anchoMm,0)} × ${fmtNum(l.ref.altoMm,0)} mm (${fmtNum(l.m2,3)} m²)`};
    if(l.tipo==='trabajo') return {...l,grupo:'Servicio',unidad:'h',desc:`Mano de obra en obra (${fmtNum(c.horasTrabajo)} h × ${tec(c.personas)})`};
    return {...l,grupo:'Servicio',unidad:'h',desc:`Transporte (${fmtNum(c.horasTransporte)} h × ${tec(c.personas)})`};
  });
  return {L,total:c.totalBs,c};
}
function renderProformaMant(m){
  const {L,total,c}=proformaLineas(m);
  const fila=l=>`<tr><td>${esc(l.desc)}</td><td class="r">${l.unidad==='h'?fmtNum(l.cant)+' h':fmtNum(l.cant,0)}</td><td class="r">${l.pu==null?'a confirmar':fmtBs(l.pu)}</td><td class="r">${l.imp==null?'a confirmar':fmtBs(l.imp)}</td></tr>`;
  const piezas=L.filter(l=>l.grupo==='Piezas'), serv=L.filter(l=>l.grupo==='Servicio');
  const tabla=(t,arr)=>arr.length?`<div class="pf-sec">${t}</div><table class="pf-tabla"><thead><tr><th>Descripción</th><th class="r">Cant.</th><th class="r">Precio unit.</th><th class="r">Importe</th></tr></thead><tbody>${arr.map(fila).join('')}</tbody></table>`:'';
  return `<div class="print-only proforma">
    <div class="pf-head"><img src="${LOGO_TS}" alt="Tecnosuisse"><div class="pf-doc"><div class="t">PROFORMA DE MANTENIMIENTO</div><div class="n">${mantCodigo(m)}</div><div class="f">Fecha: ${fechaLarga(m.fecha)}</div></div></div>
    <div class="pf-datos"><b>Cliente / obra</b><span>${esc(m.obraNombre)}</span><b>Dirección</b><span>${esc(m.direccion||'—')}</span></div>
    <div class="pf-sec">Trabajo realizado</div><div class="pf-detalle">${esc(m.detalle||'—')}</div>
    ${tabla('Piezas y materiales',piezas)}
    ${tabla('Servicio técnico',serv)}
    <div class="pf-tot">
      ${m.garantia?`<div class="g"><span>Total del servicio</span><span>${fmtBs(total)}</span></div><div class="g"><span>Cubierto por garantía</span><span>− ${fmtBs(total)}</span></div><div class="fin"><span>TOTAL A PAGAR</span><span>Bs 0,00</span></div>`
        :`<div class="fin"><span>${c.itemsPendientes?'TOTAL (parcial)':'TOTAL'}</span><span>${fmtBs(total)}</span></div>`}
    </div>
    ${c.itemsPendientes?`<div class="pf-nota"><b>Atención:</b> hay ${c.itemsPendientes} pieza(s) con precio a confirmar; el total no es definitivo.</div>`:''}
    <div class="pf-nota">Precios en bolivianos (Bs).${m.garantia?' Este mantenimiento está cubierto por la garantía de Tecnosuisse.':''}</div>
  </div>`;
}
function fechaLarga(f){ if(!f) return '—'; const [y,mo,d]=f.split('-'); return `${d}/${mo}/${y}`; }
function mantExportarProforma(id){
  const m=DB.mant.find(x=>x.id===id); if(!m) return;
  const c=calcMantenimiento(m);
  if(!m.tipoCambio) return toast('Falta el tipo de cambio: no se puede armar la proforma.');
  if(c.itemsPendientes && !confirm(`Hay ${c.itemsPendientes} pieza(s) sin precio. La proforma saldrá con "a confirmar" y total parcial. ¿Exportar igual?`)) return;
  const t=document.title; document.title='Proforma '+mantCodigo(m)+' - '+(m.obraNombre||'');
  window.print(); setTimeout(()=>document.title=t,1000);
}
async function mantGuardarPreciosManuales(id){
  const m=DB.mant.find(x=>x.id===id); if(!m) return;
  const upd=[];
  for(const i of m.items.filter(x=>x.esManual)){
    const el=document.getElementById('pi-'+i.id); const v=el.value===''?null:Number(el.value);
    if(v!==null && !(v>=0)) return toast('Precio inválido en '+i.descripcion);
    upd.push({id:i.id,precio_usd:v});
  }
  for(const u of upd){ const {error}=await sb.from('mantenimientos_items').update({precio_usd:u.precio_usd}).eq('id',u.id); if(sbErr(error)) return; }
  await recargarMant(); render(); toast('Precios guardados ✓');
  if(m.notionEstado==='ok') await sincronizarMant(id);
}
async function mantGuardarTc(id){
  const v=Number(document.getElementById('mant-tc').value);
  if(!(v>0)) return toast('Tipo de cambio inválido');
  const {error}=await sb.from('mantenimientos').update({tipo_cambio:v}).eq('id',id);
  if(sbErr(error)) return; await recargarMant(); render(); toast('Tipo de cambio guardado ✓');
  const m=DB.mant.find(x=>x.id===id); if(m && m.notionEstado==='ok') await sincronizarMant(id);
}
async function mantAplicarAjustes(id){
  if(!confirm('¿Recalcular este mantenimiento con el precio por hora y el factor actuales?')) return;
  const {error}=await sb.from('mantenimientos').update({precio_hora_bs:Number(DB.ajustes.precioHoraMantBs||0),factor:Number(DB.ajustes.factorMant||1.508)}).eq('id',id);
  if(sbErr(error)) return; await recargarMant(); render(); toast('Recalculado ✓');
  const m=DB.mant.find(x=>x.id===id); if(m && m.notionEstado==='ok') await sincronizarMant(id);
}
async function borrarMant(id){
  if(!confirm('¿Eliminar este mantenimiento? No se puede deshacer.')) return;
  const {error}=await sb.from('mantenimientos').delete().eq('id',id);
  if(sbErr(error)) return; cierreMantId=null; await recargarMant(); render(); toast('Eliminado');
}


// ---------- CONFIG: MANTENIMIENTO ----------
let mantImportPreview=null, mantCatQ='';
function renderMantConfig(){
  const ult=DB.obras.filter(o=>o.notionPageId).reduce((a,o)=>o.updatedAt&&o.updatedAt>a?o.updatedAt:a,'');
  return `<div class="card">
    <label>Precio por hora de mantenimiento (Bs, por persona)</label>
    <input type="number" step="0.5" min="0" id="aj-ph-mant" value="${DB.ajustes.precioHoraMantBs||''}" placeholder="Ej: 60">
    <label>Factor multiplicador</label>
    <input type="number" step="0.001" min="0" id="aj-factor-mant" value="${DB.ajustes.factorMant||1.508}">
    <label>Precio de malla milimétrica (Bs por m²)</label>
    <input type="number" step="0.5" min="0" id="aj-malla" value="${DB.ajustes.precioMallaBsM2||90}">
    <label>Tipo de cambio oficial (Bs por USD)</label>
    <input type="number" step="0.01" min="0" id="aj-tc" value="${DB.ajustes.tipoCambio||''}" placeholder="Ej: 11.70">
    <div class="meta" style="margin-top:4px;">${DB.ajustes.tipoCambioFecha?'Cotización BCB del '+DB.ajustes.tipoCambioFecha:'Sin fecha de cotización'}${DB.ajustes.tipoCambioAct?' · cargado '+new Date(DB.ajustes.tipoCambioAct).toLocaleString('es-BO'):''}. Se actualiza solo cada lunes con el último publicado por el BCB; podés corregirlo a mano.</div>
    <button class="btn" onclick="guardarAjustesMant()">Guardar</button>
    <div class="meta" style="margin-top:8px;">Los cambios aplican a los mantenimientos que se registren desde ahora. Los ya registrados conservan su precio y factor (se pueden recalcular desde Cierre Mant.).</div>
  </div>
  <div class="section-title">Obras desde Notion</div>
  <div class="card">
    <div class="meta">${DB.obras.filter(o=>o.notionPageId).length} obras vinculadas a Notion${ult?' · actualizado '+new Date(ult).toLocaleString('es-BO'):''}. Se excluyen las que están en Primer contacto, Cotizado, En negociación o Baja de cliente.</div>
    <button class="btn ghost" id="btn-ref-obras" onclick="refrescarObrasNotion()">Actualizar obras desde Notion</button>
  </div>
  <div class="section-title">Ítems de mantenimiento (${DB.mantItems.length})</div>
  <div class="card">
    <label>Importar desde Excel (columnas: código, descripción, precio USD)</label>
    <input type="file" accept=".xlsx,.xls,.csv" onchange="leerItemsExcel(this.files[0])">
    ${mantImportPreview?renderMantPreview():''}
    <div class="meta" style="margin-top:8px;">Si un código ya existe, se actualizan su descripción y precio. Los mantenimientos ya cargados no cambian: guardan el precio del momento.</div>
  </div>
  ${DB.mantItems.length?`<div class="card"><input type="text" placeholder="Buscar ítem…" value="${esc(mantCatQ)}" oninput="mantCatQ=this.value; document.getElementById('mant-cat').innerHTML=renderMantCatalogo();"><div id="mant-cat">${renderMantCatalogo()}</div></div>`:''}`;
}
function renderMantCatalogo(){
  const q=mantCatQ.trim().toLowerCase();
  const l=DB.mantItems.filter(i=>!q||i.codigo.toLowerCase().includes(q)||i.descripcion.toLowerCase().includes(q));
  return l.slice(0,60).map(i=>`<div class="list-item"><span><b>${esc(i.codigo)}</b> · USD ${fmtNum(i.precioUsd)}<br><span class="meta">${esc(i.descripcion)}</span></span><button class="del" onclick="borrarItemMant('${i.id}')">Eliminar</button></div>`).join('')+(l.length>60?`<div class="meta">…y ${l.length-60} más. Usá el buscador.</div>`:'');
}
function normH(s){ return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z]/g,''); }
function parsePrecio(v){
  if(typeof v==='number') return v;
  let s=String(v||'').replace(/usd|\$|\s/gi,'');
  if(/,\d{1,2}$/.test(s)) s=s.replace(/\./g,'').replace(',','.'); else s=s.replace(/,/g,'');
  return Number(s);
}
async function leerItemsExcel(file){
  if(!file) return;
  try{
    const wb=XLSX.read(await file.arrayBuffer());
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});
    let hi=-1, cc=-1, cd=-1, cp=-1;
    for(let r=0;r<Math.min(rows.length,15);r++){
      const h=rows[r].map(normH);
      const c=h.findIndex(x=>x.startsWith('codigo')||x==='cod'), d=h.findIndex(x=>x.startsWith('descripcion')||x==='detalle'), p=h.findIndex(x=>x.includes('precio')||x.includes('usd'));
      if(c>=0&&d>=0&&p>=0){ hi=r; cc=c; cd=d; cp=p; break; }
    }
    if(hi<0){ mantImportPreview={error:'No encontré las columnas "código", "descripción" y "precio" en las primeras filas de la primera hoja.'}; render(); return; }
    const map=new Map(), errores=[];
    rows.slice(hi+1).forEach((r,ix)=>{
      const codigo=String(r[cc]).trim(), descripcion=String(r[cd]).trim(), precio=parsePrecio(r[cp]);
      if(!codigo&&!descripcion) return;
      if(!codigo||!descripcion||!isFinite(precio)||precio<0){ errores.push(`Fila ${hi+ix+2}: ${codigo||'(sin código)'}`); return; }
      map.set(codigo,{codigo,descripcion,precio_usd:Math.round(precio*10000)/10000,activo:true,updated_at:new Date().toISOString()});
    });
    const filas=[...map.values()], existentes=new Set(DB.mantItems.map(i=>i.codigo));
    mantImportPreview={archivo:file.name,filas,errores,nuevos:filas.filter(f=>!existentes.has(f.codigo)).length};
  }catch(e){ mantImportPreview={error:'No se pudo leer el archivo: '+(e.message||e)}; }
  render();
}
function renderMantPreview(){
  const p=mantImportPreview;
  if(p.error) return `<div class="flag-line f-crit" style="margin-top:8px;">⚠ ${esc(p.error)}</div>`;
  return `<div class="detail-item"><b>${esc(p.archivo)}</b>: ${p.filas.length} ítems válidos (${p.nuevos} nuevos, ${p.filas.length-p.nuevos} a actualizar)${p.errores.length?` · <span style="color:var(--red);">${p.errores.length} filas con error</span>`:''}
    <table class="cierre-table" style="margin-top:8px;"><thead><tr><th>Código</th><th>Descripción</th><th>USD</th></tr></thead><tbody>${p.filas.slice(0,8).map(f=>`<tr><td>${esc(f.codigo)}</td><td>${esc(f.descripcion)}</td><td>${fmtNum(f.precio_usd)}</td></tr>`).join('')}</tbody></table>
    ${p.errores.length?`<div class="flag-line f-crit">${esc(p.errores.slice(0,10).join(' · '))}${p.errores.length>10?' …':''}</div>`:''}
    <div class="actions"><button class="btn small" onclick="confirmarImportItems()">Importar ${p.filas.length} ítems</button><button class="btn small ghost" onclick="mantImportPreview=null; render();">Cancelar</button></div></div>`;
}
async function confirmarImportItems(){
  const filas=mantImportPreview.filas;
  for(let i=0;i<filas.length;i+=500){
    const {error}=await sb.from('mant_items').upsert(filas.slice(i,i+500),{onConflict:'codigo'});
    if(sbErr(error)) return;
  }
  mantImportPreview=null; await recargarCatalogos(); render(); toast(`${filas.length} ítems importados ✓`);
}
async function borrarItemMant(id){
  if(!confirm('¿Eliminar este ítem del catálogo? Los mantenimientos que ya lo usaron no cambian.')) return;
  const {error}=await sb.from('mant_items').delete().eq('id',id);
  if(sbErr(error)) return; await recargarCatalogos(); render();
}
async function guardarAjustesMant(){
  const ph=Number(document.getElementById('aj-ph-mant').value||0), fa=Number(document.getElementById('aj-factor-mant').value||0);
  const malla=Number(document.getElementById('aj-malla').value||0), tcTxt=document.getElementById('aj-tc').value, tc=Number(tcTxt);
  if(!(fa>0)) return toast('Factor inválido');
  if(!(malla>=0)) return toast('Precio de malla inválido');
  if(tcTxt!=='' && !(tc>1 && tc<100)) return toast('Tipo de cambio inválido');
  const upd={precio_hora_mant_bs:ph,factor_mant:fa,precio_malla_bs_m2:malla};
  const tcCambio = tcTxt!=='' && tc!==DB.ajustes.tipoCambio;
  if(tcCambio){ upd.tipo_cambio=tc; upd.tipo_cambio_fecha=todayStr(); upd.tipo_cambio_actualizado=new Date().toISOString(); }
  const {error}=await sb.from('ajustes').update(upd).eq('id',1);
  if(sbErr(error)) return;
  Object.assign(DB.ajustes,{precioHoraMantBs:ph,factorMant:fa,precioMallaBsM2:malla});
  if(tcCambio) Object.assign(DB.ajustes,{tipoCambio:tc,tipoCambioFecha:todayStr(),tipoCambioAct:upd.tipo_cambio_actualizado});
  toast('Guardado ✓'); render();
}
async function refrescarObrasNotion(){
  const b=document.getElementById('btn-ref-obras'); if(b){ b.disabled=true; b.textContent='Consultando Notion…'; }
  try{
    const data=await invocarFn({action:'refrescar_obras'});
    await recargarObras(); render(); toast(`${data.obras} obras actualizadas desde Notion ✓`);
  }catch(e){ render(); toast('No se pudo actualizar: '+(e.message||e)); }
}


// ---------- NAVEGACIÓN POR ROL Y ARRANQUE ----------
// Cada pestaña declara quién la ve. 'admin' ve todo; el personal de campo ve solo lo que registra.
const TABS=[
  {id:'captura',        label:'Registrar',      titulo:'Registro de horas',       ver:p=>esAdmin()||esCampoProduccion()},
  {id:'mantenimientos', label:'Mantenimiento',  titulo:'Nuevo mantenimiento',     ver:p=>esAdmin()||esCampoMant()},
  {id:'reportes',       label:'Horas del día',  titulo:'Control de horas',        ver:p=>esAdmin()},
  {id:'cierre',         label:'Obras',          titulo:'Obras y cierre',          ver:p=>esAdmin()},
  {id:'cierremant',     label:'Proformas',      titulo:'Mantenimientos y proformas', ver:p=>esAdmin()},
  {id:'config',         label:'Config',         titulo:'Configuración',           ver:p=>esAdmin()},
];
function tabsVisibles(){ return TABS.filter(t=>t.ver(PERFIL)); }

function renderShell(){
  const tabs=tabsVisibles();
  if(!tabs.some(t=>t.id===currentTab)) currentTab=tabs.length?tabs[0].id:'';
  const t=TABS.find(x=>x.id===currentTab);
  document.getElementById('hdr-empresa').textContent=PERFIL?(PERFIL.empresa||''):'';
  document.getElementById('hdr-titulo').textContent=t?t.titulo:'Control de Producción';
  document.getElementById('hdr-user').innerHTML=PERFIL?`<span>${esc(PERFIL.persona||'Administrador')}</span><button class="link-btn" onclick="cerrarSesion()">Salir</button>`:'';
  const nav=document.getElementById('nav');
  nav.style.display=tabs.length>1?'':'none';
  nav.innerHTML=tabs.map(x=>`<button data-tab="${x.id}" class="${x.id===currentTab?'active':''}">${x.label}</button>`).join('');
  nav.querySelectorAll('button').forEach(btn=>btn.addEventListener('click',()=>irA(btn.dataset.tab)));
  document.body.classList.toggle('rol-admin',esAdmin());
}
function irA(tab){
  currentTab=tab; reportEditKey=null; agregandoInstalacionManual=false;
  sb.auth.getSession().then(({data:{session}})=>{ if(!session) renderLoginScreen(); else { renderShell(); render(); window.scrollTo(0,0); } });
}

function render(){
  const main=document.getElementById('main');
  const t=TABS.find(x=>x.id===currentTab);
  if(!t || !t.ver(PERFIL)){ main.innerHTML=`<div class="empty"><strong>Sin acceso</strong>Esta sección no está habilitada para tu usuario.</div>`; return; }
  if(currentTab==='captura') main.innerHTML=renderCaptura();
  else if(currentTab==='mantenimientos') main.innerHTML=renderMantenimientos();
  else if(currentTab==='cierremant') main.innerHTML=renderCierreMant();
  else if(currentTab==='reportes') main.innerHTML=renderReportes();
  else if(currentTab==='cierre') main.innerHTML=renderCierre();
  else main.innerHTML=renderConfig();
  main.innerHTML+=`<div class="footnote">${esc(PERFIL&&PERFIL.empresa||'')} · Control de Producción v${APP_VERSION}</div>`;
  if(currentTab==='captura') enlazarCaptura();
}

(async function init(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){ renderLoginScreen(); return; }
  await iniciarSesionApp();
})();

</script>
