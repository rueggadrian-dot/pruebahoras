function normH(s){ return String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^a-z]/g,''); }
function parsePrecio(v){
  if(typeof v==='number') return v;
  let s=String(v||'').replace(/usd|\$|\s/gi,'');
  if(/,\d{1,2}$/.test(s)) s=s.replace(/\./g,'').replace(',','.'); else s=s.replace(/,/g,'');
  return Number(s);
}
async function leerItemsExcel(file){
  if(!file) return;
  try{
    const wb=XLSX.read(await file.arrayBuffer());
    const rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,defval:''});
    let hi=-1, cc=-1, cd=-1, cp=-1;
    for(let r=0;r<Math.min(rows.length,15);r++){
      const h=rows[r].map(normH);
      const c=h.findIndex(x=>x.startsWith('codigo')||x==='cod'), d=h.findIndex(x=>x.startsWith('descripcion')||x==='detalle'), p=h.findIndex(x=>x.includes('precio')||x.includes('usd'));
      if(c>=0&&d>=0&&p>=0){ hi=r; cc=c; cd=d; cp=p; break; }
    }
    if(hi<0){ mantImportPreview={error:'No encontré las columnas "código", "descripción" y "precio" en las primeras filas de la primera hoja.'}; render(); return; }
    const map=new Map(), errores=[];
    rows.slice(hi+1).forEach((r,ix)=>{
      const codigo=String(r[cc]).trim(), descripcion=String(r[cd]).trim(), precio=parsePrecio(r[cp]);
      if(!codigo&&!descripcion) return;
      if(!codigo||!descripcion||!isFinite(precio)||precio<0){ errores.push(`Fila ${hi+ix+2}: ${codigo||'(sin código)'}`); return; }
      map.set(codigo,{codigo,descripcion,precio_usd:Math.round(precio*10000)/10000,activo:true,updated_at:new Date().toISOString()});
    });
    const filas=[...map.values()], existentes=new Set(DB.mantItems.map(i=>i.codigo));
    mantImportPreview={archivo:file.name,filas,errores,nuevos:filas.filter(f=>!existentes.has(f.codigo)).length};
  }catch(e){ mantImportPreview={error:'No se pudo leer el archivo: '+(e.message||e)}; }
  render();
}
function renderMantPreview(){
  const p=mantImportPreview;
  if(p.error) return `<div class="flag-line f-crit" style="margin-top:8px;">⚠ ${esc(p.error)}</div>`;
  return `<div class="detail-item"><b>${esc(p.archivo)}</b>: ${p.filas.length} ítems válidos (${p.nuevos} nuevos, ${p.filas.length-p.nuevos} a actualizar)${p.errores.length?` · <span style="color:var(--red);">${p.errores.length} filas con error</span>`:''}
    <table class="cierre-table" style="margin-top:8px;"><thead><tr><th>Código</th><th>Descripción</th><th>USD</th></tr></thead><tbody>${p.filas.slice(0,8).map(f=>`<tr><td>${esc(f.codigo)}</td><td>${esc(f.descripcion)}</td><td>${fmtNum(f.precio_usd)}</td></tr>`).join('')}</tbody></table>
    ${p.errores.length?`<div class="flag-line f-crit">${esc(p.errores.slice(0,10).join(' · '))}${p.errores.length>10?' …':''}</div>`:''}
    <div class="actions"><button class="btn small" onclick="confirmarImportItems()">Importar ${p.filas.length} ítems</button><button class="btn small ghost" onclick="mantImportPreview=null; render();">Cancelar</button></div></div>`;
}
async function confirmarImportItems(){
  const filas=mantImportPreview.filas;
  for(let i=0;i<filas.length;i+=500){
    const {error}=await sb.from('mant_items').upsert(filas.slice(i,i+500),{onConflict:'codigo'});
    if(sbErr(error)) return;
  }
  mantImportPreview=null; await recargarCatalogos(); render(); toast(`${filas.length} ítems importados ✓`);
}
async function borrarItemMant(id){
  if(!confirm('¿Eliminar este ítem del catálogo? Los mantenimientos que ya lo usaron no cambian.')) return;
  const {error}=await sb.from('mant_items').delete().eq('id',id);
  if(sbErr(error)) return; await recargarCatalogos(); render();
}
async function guardarAjustesMant(){
  const ph=Number(document.getElementById('aj-ph-mant').value||0), fa=Number(document.getElementById('aj-factor-mant').value||0);
  const malla=Number(document.getElementById('aj-malla').value||0), tcTxt=document.getElementById('aj-tc').value, tc=Number(tcTxt);
  if(!(fa>0)) return toast('Factor inválido');
  if(!(malla>=0)) return toast('Precio de malla inválido');
  if(tcTxt!=='' && !(tc>1 && tc<100)) return toast('Tipo de cambio inválido');
  const upd={precio_hora_mant_bs:ph,factor_mant:fa,precio_malla_bs_m2:malla};
  const tcCambio = tcTxt!=='' && tc!==DB.ajustes.tipoCambio;
  if(tcCambio){ upd.tipo_cambio=tc; upd.tipo_cambio_fecha=todayStr(); upd.tipo_cambio_actualizado=new Date().toISOString(); }
  const {error}=await sb.from('ajustes').update(upd).eq('id',1);
  if(sbErr(error)) return;
  Object.assign(DB.ajustes,{precioHoraMantBs:ph,factorMant:fa,precioMallaBsM2:malla});
  if(tcCambio) Object.assign(DB.ajustes,{tipoCambio:tc,tipoCambioFecha:todayStr(),tipoCambioAct:upd.tipo_cambio_actualizado});
  toast('Guardado ✓'); render();
}
async function refrescarObrasNotion(){
  const b=document.getElementById('btn-ref-obras'); if(b){ b.disabled=true; b.textContent='Consultando Notion…'; }
  try{
    const data=await invocarFn({action:'refrescar_obras'});
    await recargarCatalogos(); render(); toast(`${data.obras} obras actualizadas desde Notion ✓`);
  }catch(e){ render(); toast('No se pudo actualizar: '+(e.message||e)); }
}

// ---------- MAIN RENDER ----------
function render(){
  const main=document.getElementById('main');
  if(currentTab!=='captura' && currentTab!=='mantenimientos' && !authenticated){ main.innerHTML=renderPasswordGate(); return; }
  if(currentTab==='captura') main.innerHTML=renderCaptura();
  else if(currentTab==='mantenimientos') main.innerHTML=renderMantenimientos();
  else if(currentTab==='cierremant') main.innerHTML=renderCierreMant();
  else if(currentTab==='reportes') main.innerHTML=renderReportes();
  else if(currentTab==='cierre') main.innerHTML=renderCierre();
  else main.innerHTML=renderConfig();
  main.innerHTML+=`<div class="footnote">Datos compartidos entre todos los responsables que usan este panel.<br>Tecnosuisse — Control de Producción v22 · Supabase · Login</div>`;
  if(currentTab==='captura'){
    const selP=document.getElementById('cap-persona'), selO=document.getElementById('cap-obra'), selF=document.getElementById('cap-fecha');
    const updateDynamic=()=>{ capPersonaId=selP.value; capObraId=selO.value; capFecha=selF?selF.value:''; const dyn=document.getElementById('cap-form-dynamic'); if(dyn) dyn.innerHTML=renderCapturaFormFor(selP.value,selO.value); };
    if(selP) selP.addEventListener('change',updateDynamic);
    if(selO) selO.addEventListener('change',updateDynamic);
    if(selF) selF.addEventListener('change',updateDynamic);
    if(selP && selP.value) updateDynamic();
  }
}
document.querySelectorAll('nav.tabs button').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('nav.tabs button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active'); currentTab=btn.dataset.tab; reportEditKey=null; agregandoInstalacionManual=false;
    sb.auth.getSession().then(({data:{session}})=>{ if(!session){ renderLoginScreen(); } else { render(); } });
  });
});
(async function init(){
  const {data:{session}}=await sb.auth.getSession();
  if(!session){ renderLoginScreen(); return; }
  await loadAll(); render();
})();
</script>
